<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIN | Open Source Procurement Toolkit</title>
<meta name="description" content="Institutional assessment of research software and hardware. Repository evidence is fetched automatically; judgment stays with people.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a quiet institutional form. One wide column; the case view splits into a sticky summary rail and a long questionnaire. */
:root{
  color-scheme:light;
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#e9ecf2; --fg:#1b2130; --muted:#4f5869; --line:#cfd4df; --line-strong:#7f879b;
  --accent:#2a4a8b; --accent-ink:#ffffff; --accent-soft:#e3e9f6; --accent-soft-ink:#1f3a70;
  --ok:#1f6b3d; --ok-soft:#e3f2e8; --warn:#875012; --warn-soft:#f8edd8; --bad:#9f2f22; --bad-soft:#f8e3df; --info:#2b5a7d; --info-soft:#e2ecf4;
  --display:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --rail:300px;
}

*{box-sizing:border-box} html{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)} a:hover{text-decoration-thickness:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,40px)} h2{font-size:22px} h3{font-size:17px} h4{font-size:15px;font-family:var(--body);font-weight:600}
p{margin:0} .muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono);font-size:12.5px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-family:var(--display);font-weight:600}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.05em}
.brand .ver{font:11px var(--mono);color:var(--muted);letter-spacing:.1em;margin-left:4px}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{padding:7px 11px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:500}
nav.main a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-soft-ink)}

main{padding-block:28px 64px}
.view{display:grid;gap:22px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.tight{padding:14px 16px}
.stack{display:grid;gap:12px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;text-decoration:none;color:inherit;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:13px} .btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.danger{color:var(--bad)}

label.field{display:grid;gap:6px;font-size:13.5px;font-weight:500}
label.field span.hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=url],input[type=password],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);min-width:0}
textarea{min-height:72px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.check input{margin-top:3px;flex:none}
.check b{font-weight:600} .check .why{display:block;color:var(--muted);font-size:13px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:7px 12px;cursor:pointer;font-size:13.5px;border-right:1px solid var(--line);display:flex;gap:6px;align-items:center;background:var(--surface)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.outline{background:transparent;border-color:var(--line-strong);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font:11.5px var(--mono);padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2);cursor:help}
.chip.M{border-color:var(--accent);color:var(--accent-soft-ink);background:var(--accent-soft)} .chip.E{border-color:var(--info);color:var(--info);background:var(--info-soft)} .chip.U{border-style:dashed}

/* stage header strip */
.pathway{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pathway .step{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;gap:3px;min-width:0;text-decoration:none;color:inherit}
.pathway .step .n{font:11px var(--mono);color:var(--muted)} .pathway .step b{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.2}
.pathway .step .prog{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:4px} .pathway .step .prog i{display:block;height:100%;background:var(--accent)}
@media (max-width:760px){ .pathway{grid-template-columns:repeat(2,minmax(0,1fr))} .pathway .step:last-child{grid-column:span 2} }

/* case layout */
.case{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:22px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:14px;max-height:calc(100vh - 90px);overflow:auto}
@media (max-width:900px){ .case{grid-template-columns:1fr} .rail{position:static;max-height:none} }
.rail .k{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)} .rail .k:last-child{border-bottom:0}
.rail .k b{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}

.stage{display:grid;gap:14px;scroll-margin-top:90px}
.stage-head{display:grid;gap:4px;padding:6px 0 0}
.stage-head .who{font-size:13px;color:var(--muted)}
.domain{display:grid;gap:10px}
.domain h4{color:var(--muted);font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding-top:6px}

.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;border-left:4px solid var(--line)}
.q[data-v="yes"]{border-left-color:var(--ok)} .q[data-v="partial"]{border-left-color:var(--warn)} .q[data-v="no"]{border-left-color:var(--bad)} .q[data-v="na"]{border-left-color:var(--line-strong)}
.q .qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q .qid{font:12px var(--mono);color:var(--muted);min-width:34px} .q .qt{font-weight:600;font-size:15px;flex:1 1 300px;min-width:0}
.q .srcs{display:flex;gap:4px;flex-wrap:wrap}
.q .help{font-size:13px;color:var(--muted)}
.ev{display:grid;gap:4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.ev .evi{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;min-width:0}
.ev .dot{flex:none;width:16px;height:16px;border-radius:50%;margin-top:3px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font:700 10px var(--mono);line-height:1}
.ev .dot::before{content:"·"} .ev .dot.ok::before{content:"✓"} .ev .dot.bad::before{content:"✗"} .ev .dot.mixed::before{content:"~"}
.ev .dot.ok{background:var(--ok);color:#fff} .ev .dot.bad{background:var(--bad);color:#fff} .ev .dot.mixed{background:var(--warn);color:#fff}
.ev .evl{color:var(--muted);flex:0 0 auto;max-width:45%} .ev .evv{min-width:0;overflow-wrap:anywhere} .ev .evs{font:11px var(--mono);color:var(--muted);margin-left:auto;flex:none}
.ev .evcap{font-size:12px;color:var(--muted);padding-top:4px;border-top:1px dashed var(--line);margin-top:4px}
.suggest{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.q .ans{display:grid;gap:8px}
.q textarea{min-height:44px}
.q .note-label{font-size:12.5px;color:var(--muted)}
.specialist{font-size:12px;color:var(--info)}

.route{display:grid;gap:10px}
.route .big{font-family:var(--display);font-size:20px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.route ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
.route li .kind{font:11px var(--mono);color:var(--muted);margin-right:6px}

.cases{display:grid;gap:8px}
.cases a.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:inherit}
.cases a.item:hover{border-color:var(--accent)}
.cases .nm{font-weight:600;font-family:var(--display)} .cases .mt{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}

table{border-collapse:collapse;width:100%;font-size:13.5px} th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)} th{font-weight:600;font-size:12.5px;color:var(--muted)}
.tablewrap{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.log{font:12.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:160px;overflow:auto;white-space:pre-wrap}
details.src{border-top:1px solid var(--line);padding:10px 0} details.src summary{cursor:pointer;font-weight:600;font-family:var(--display)} details.src p{font-size:13.5px;color:var(--muted);padding-top:4px}

.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:grid;gap:22px;max-width:900px}
.report h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:6px}
.report .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:13.5px} .report .kv dt{color:var(--muted)} .report .kv dd{margin:0;overflow-wrap:anywhere}
.v{font:12px var(--mono);padding:1px 6px;border-radius:4px;white-space:nowrap} .v.yes{background:var(--ok-soft);color:var(--ok)} .v.partial{background:var(--warn-soft);color:var(--warn)} .v.no{background:var(--bad-soft);color:var(--bad)} .v.na{background:var(--surface-2);color:var(--muted)} .v.unset{border:1px dashed var(--line-strong);color:var(--muted)}


/* ---- simplified interface ---- */
.hero{display:grid;gap:14px;max-width:760px;padding-block:18px 8px}
.hero .lead{font-size:16.5px;max-width:62ch}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding-block:6px}
.role{display:grid;gap:6px;padding:18px 20px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);text-decoration:none;color:inherit}
.role:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.role b{font-family:var(--display);font-size:20px;font-weight:600}
.start{display:flex;gap:8px;flex-wrap:wrap}
.start input{flex:1 1 320px;padding:13px 14px;font-size:16px;border-radius:10px}
.btn.big{padding:13px 20px;font-size:16px;border-radius:10px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:980px}
.howto .step{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.howto .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 13px var(--mono)}
.howto b{font-family:var(--display);font-weight:600;display:block;margin-bottom:2px}

.formv{display:grid;gap:18px;max-width:900px}
.casehead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.qcard{display:grid;gap:10px;padding:20px 22px}
.qcard h3{font-size:19px}
.qcard .hint{font-weight:400;color:var(--muted);font-size:13.5px;line-height:1.5}
.qcard label.field{gap:6px}
.draft{font-weight:400;font-size:12.5px;color:var(--info)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.check input{margin-top:2px}
.evd{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.evd summary{cursor:pointer;font-size:13.5px;font-weight:500}
.evd .ev{border:0;padding:8px 0 0;background:transparent}

.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){ .glance{grid-template-columns:repeat(2,minmax(0,1fr))} }
.urlfield{grid-column:1 / -1} .urlfield .row{flex-wrap:nowrap} .urlfield .btn{white-space:nowrap;flex:none}
.tile{display:grid;gap:3px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.tile .tl{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .tv{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.tile .ts{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.tile .ts i{width:14px;height:14px;border-radius:50%;background:var(--line-strong);flex:none;color:#fff;font:700 9px var(--mono);display:grid;place-items:center;font-style:normal}
.tile.ok .ts i::before{content:"✓"} .tile.warn .ts i::before{content:"!"} .tile.bad .ts i::before{content:"✗"}
.tile.ok .ts{color:var(--ok)} .tile.ok .ts i{background:var(--ok)} .tile.warn .ts{color:var(--warn)} .tile.warn .ts i{background:var(--warn)} .tile.bad .ts{color:var(--bad)} .tile.bad .ts i{background:var(--bad)} .tile.none .ts{color:var(--muted)}
.tile .tsub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

.banner{padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:14px;line-height:1.5}
.banner b{font-family:var(--display);font-weight:600;display:block;margin-bottom:2px;font-size:15px}
.banner.route-light{border-color:var(--ok);background:var(--ok-soft)} .banner.route-extended{border-color:var(--warn);background:var(--warn-soft)} .banner.route-clarify,.banner.info{border-color:var(--info);background:var(--info-soft)} .banner.warn{border-color:var(--warn);background:var(--warn-soft)}

.listbar{padding:4px 0}
.seg.small label{padding:5px 10px;font-size:13px}
.stage{gap:8px} .stage-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:14px}
.qlist{display:grid;gap:4px}
.qr{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.qr.open{border-color:var(--line-strong)}
.qrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto 16px;gap:10px;align-items:center;padding:8px 10px;cursor:pointer}
.qrow:hover{background:var(--bg)}
.st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);border:1px solid var(--line-strong);color:var(--muted);background:var(--surface)}
.st.yes{background:var(--ok);border-color:var(--ok);color:#fff} .st.partial{background:var(--warn);border-color:var(--warn);color:#fff} .st.no{background:var(--bad);border-color:var(--bad);color:#fff} .st.na{background:var(--surface-2);color:var(--muted)}
.st.sug{background:transparent;border-style:dashed} .st.yes.sug{color:var(--ok)} .st.partial.sug{color:var(--warn)} .st.no.sug{color:var(--bad)}
.qtxt{display:grid;gap:1px;min-width:0;font-size:14px;line-height:1.35}
.qtxt .qid{font:11px var(--mono);color:var(--muted);margin-right:6px}
.qev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tenref{font:11px var(--mono);color:var(--accent-soft-ink);background:var(--accent-soft);padding:0 5px;border-radius:4px;margin-right:6px}
.vbtns{display:inline-flex;gap:3px}
.vb{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:600 13px var(--mono);color:var(--muted)}
.vb:hover{border-color:var(--line-strong)}
.vb.on.yes{background:var(--ok);border-color:var(--ok);color:#fff} .vb.on.partial{background:var(--warn);border-color:var(--warn);color:#fff} .vb.on.no{background:var(--bad);border-color:var(--bad);color:#fff}
.caret{color:var(--muted);transition:transform .15s} .qr.open .caret{transform:rotate(180deg)}
.qdetail{display:grid;gap:10px;padding:4px 12px 14px 46px;border-top:1px solid var(--line)}
@media (max-width:640px){ .qrow{grid-template-columns:26px minmax(0,1fr) 16px} .vbtns{grid-column:2;justify-self:start} .qdetail{padding-left:12px} .qev{white-space:normal} }
.areas{display:grid;gap:12px}
.gaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.gap .why{font-size:12.5px}
.area{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.area.ok{border-left-color:var(--ok)} .area.followup{border-left-color:var(--warn)} .area.refer{border-left-color:var(--info)} .area.na{border-left-color:var(--line-strong)}
.ahead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ahead h3{font-size:17px}

function parseRepoUrl(input){
  let s = (input||"").trim();
  if(!s) return null;
  if(!/^https?:\/\//i.test(s)) s = "https://" + s;
  let u; try { u = new URL(s); } catch(e){ return null; }
  const host = u.hostname.toLowerCase();
  const parts = u.pathname.replace(/\.git$/,"").split("/").filter(Boolean);
  if(parts.length < 2) return null;
  let kind = "unknown";
  if(host === "github.com" || host === "www.github.com") kind = "github";
  else if(host === "gitlab.com" || host.includes("gitlab")) kind = "gitlab";
  else if(host === "codeberg.org" || host.includes("gitea") || host.includes("forgejo")) kind = "gitea";
  // GitLab supports nested groups: owner is everything before the last segment (stop at "/-/")
  let owner, repo;
  if(kind === "gitlab"){
    const idx = parts.indexOf("-");
    const p = idx > -1 ? parts.slice(0, idx) : parts;
    repo = p[p.length-1]; owner = p.slice(0,-1).join("/");
  } else { owner = parts[0]; repo = parts[1]; }
  return { kind, host, owner, repo, path: owner + "/" + repo, canonical: `https://${host}/${owner}/${repo}` };
}

async function getJSON(url, headers, errors, label){
  try {
    const r = await fetch(url, { headers: Object.assign({ "Accept": "application/json" }, headers||{}) });
    if(r.status === 404) return { notFound:true };
    if(r.status === 403 || r.status === 429){
      const rem = r.headers.get("x-ratelimit-remaining");
      const reset = r.headers.get("x-ratelimit-reset");
      let msg = `${label||url}: HTTP ${r.status}`;
      if(rem === "0" && reset){ msg += ` (rate limit reached; resets ${new Date(Number(reset)*1000).toLocaleTimeString()})`; }
      errors.push(msg); return null;
    }
    if(!r.ok){ errors.push(`${label||url}: HTTP ${r.status}`); return null; }
    const j = await r.json();

// ---------- Route: light review vs extended review ----------
// Mirrors the portal's rule: start light; expand only when a trigger fires.
function computeRoute(c, S, answers){
  const t = [];
  const a = (q) => answers && answers[q] ? answers[q].verdict : null;
  if(c.activity === "commissioned") t.push({ kind:"clarify", text:"Commissioned development: clarify scope before setting the route." });
  if(c.sensitiveData) t.push({ kind:"trigger", text:"The software or hardware handles sensitive or personal data.", refer:"privacy / data protection" });
  if(c.externalService) t.push({ kind:"trigger", text:"An external shared service or provider will host or access institutional systems.", refer:"information security" });
  if(c.materialDependency) t.push({ kind:"trigger", text:"The project is a material dependency for the research or unit." });
  if(c.clinical) t.push({ kind:"trigger", text:"Clinical or physical-safety relevance declared.", refer:"specialist safety / clinical review" });
  else if(c.clinicalUnknown) t.push({ kind:"follow-up", text:"Clinical or safety relevance not yet known; confirm before the decision." });
  if(c.kind !== "software" || c.hardwareWork) t.push({ kind:"trigger", text:"Physical hardware: fabrication, acceptance and safety questions apply." });
  if(S && S.ok){
    if(!S.license.spdx) t.push({ kind:"baseline", text:"No license detected in the repository." });
    else if(S.license.spdx === "unrecognized") t.push({ kind:"baseline", text:"License file present but not recognised; legal reading needed.", refer:"legal" });
    else if(!S.license.osi && !S.license.hardware) t.push({ kind:"baseline", text:`License ${S.license.spdx} is not on the OSI-approved list used here.`, refer:"legal" });
    if(S.meta.archived) t.push({ kind:"baseline", text:"Upstream repository is archived." });
    const d = daysSince(S.meta.pushedAt); if(d != null && d > 365) t.push({ kind:"baseline", text:`No activity for ${d} days.` });
    if(!S.files.security) t.push({ kind:"baseline", text:"No vulnerability disclosure policy found." });
    const v = S.scorecard && S.scorecard.checks && S.scorecard.checks["Vulnerabilities"]; if(v && v.score != null && v.score >= 0 && v.score < 7) t.push({ kind:"baseline", text:`Scorecard reports known vulnerabilities (${v.score}/10).` });
    if(S.people.topShare != null && S.people.topShare > 0.8 && (S.people.contributorsCount||0) < 10) t.push({ kind:"baseline", text:"Contribution history concentrated in one person." });
  }
  ["Q03","Q25","Q28","Q51"].forEach(q => { if(a(q) === "no") t.push({ kind:"assessor", text:`${q} marked “not satisfied” by the assessor.` }); });
  const route = t.some(x=>x.kind==="clarify") ? "clarify" : t.some(x=>x.kind!=="follow-up") ? "extended" : "light";
  return { route, triggers: t };
}

// Derive the flags the route logic uses from the form
function formToContext(f){
  const sup = new Set(f.support||[]);
  return {
    kind: f.type === "both" ? "both" : f.type === "hardware" ? "hardware" : "software",
    activity: sup.has("development") ? "commissioned" : (sup.has("maintenance") || sup.has("hosting") || sup.has("training") || sup.has("funding")) ? "services" : "reuse",
    sensitiveData: f.data && f.data !== "public",
    externalService: f.systems === "institutional" || sup.has("hosting"),
    materialDependency: f.impact === "high",
    clinical: f.clinical === "yes",
    clinicalUnknown: f.clinical === "unknown",
    hardwareWork: sup.has("equipment") || f.type === "hardware" || f.type === "both"
  };
}

  m.push("Still to confirm: actual maintainer or supplier availability for this request, our team's capacity, and the institutional fallback if support stops.");

function routeBanner(R){

// At-a-glance tiles: status with a word beside each dot, never color alone
function glanceTiles(S){
  const L = S.license, A = S.activity, P = S.people, F = S.files, sc = S.scorecard, dPush = daysSince(S.meta.pushedAt);
  const t = [];
  t.push(L.spdx && L.spdx !== "unrecognized" ? { label:"License", value: L.spdx, state: (L.osi||L.hardware) ? "ok" : "warn", word: L.osi ? "OSI-approved" : L.hardware ? "Open hardware" : "Check terms" } : L.spdx === "unrecognized" ? { label:"License", value:"Unrecognised", state:"warn", word:"Read the file" } : { label:"License", value:"None found", state:"bad", word:"Missing" });
  const actState = S.meta.archived ? "bad" : dPush == null ? "none" : dPush <= 180 ? "ok" : dPush <= 365 ? "warn" : "bad";
  t.push({ label:"Activity", value: S.meta.archived ? "Archived" : dPush == null ? "—" : dPush <= 30 ? "Active this month" : `Last push ${dPush} d ago`, state: actState, word: S.meta.archived ? "Read-only upstream" : actState === "ok" ? "Maintained" : actState === "warn" ? "Slowing" : "Stale", sub: A.latestRelease ? `Release ${A.latestRelease.tag||""} · ${fmtDate(A.latestRelease.date)}` : A.latestTag ? `Tag ${A.latestTag}, no releases` : "No releases" });
  if(P.contributorsCount != null){ const st = P.topShare == null ? "none" : P.topShare > 0.8 ? "bad" : P.topShare > 0.5 ? "warn" : "ok"; t.push({ label:"Maintainers", value: `${P.contributorsCount}${P.contributorsCapped?"+":""} contributors`, state: st, word: st === "ok" ? "Shared load" : st === "warn" ? "Concentrated" : st === "bad" ? "One person" : "—", sub: P.topShare != null ? `Top contributor ${pct(P.topShare)} · ${P.recentAuthors ?? "—"} active in 90 d` : "" }); }
  else t.push({ label:"Maintainers", value: `${P.recentAuthors ?? "—"} active authors`, state: P.recentAuthors >= 3 ? "ok" : P.recentAuthors >= 1 ? "warn" : "none", word: P.recentAuthors >= 3 ? "Several" : P.recentAuthors >= 1 ? "Few" : "Unknown", sub:"last 90 days" });
  const vuln = sc && sc.checks && sc.checks["Vulnerabilities"]; const vulnBad = vuln && vuln.score != null && vuln.score >= 0 && vuln.score < 7;
  t.push({ label:"Security", value: F.security ? "Policy present" : "No policy", state: vulnBad ? "bad" : F.security ? "ok" : "warn", word: vulnBad ? "Known vulnerabilities" : F.security ? "Disclosure route" : "No disclosure route", sub: (F.workflows && F.workflows.length ? `CI: ${F.workflows.length} workflow${F.workflows.length===1?"":"s"}` : "No CI found") + (vuln && !vulnBad && vuln.score >= 0 ? " · no known vulns" : "") });
  const docs = [F.readme, F.contributing, F.codeOfConduct, F.docsDir].filter(Boolean).length;
  t.push({ label:"Documentation", value: `${docs} of 4 basics`, state: docs >= 3 ? "ok" : docs >= 1 ? "warn" : "bad", word: docs >= 3 ? "Present" : docs >= 1 ? "Partial" : "Missing", sub: ["README","CONTRIBUTING","Code of conduct","docs/"].filter((_,i) => ![F.readme, F.contributing, F.codeOfConduct, F.docsDir][i]).map(x => "no " + x).join(", ") || "README, CONTRIBUTING, conduct, docs/" });
  if(sc) t.push({ label:"OpenSSF Scorecard", value: sc.score != null ? sc.score.toFixed(1) + " / 10" : "—", state: sc.score == null ? "none" : sc.score >= 7 ? "ok" : sc.score >= 4 ? "warn" : "bad", word: sc.score == null ? "—" : sc.score >= 7 ? "Good" : sc.score >= 4 ? "Mixed" : "Low", sub: Object.entries(sc.checks).filter(([k,v]) => v.score != null && v.score >= 0 && v.score < 4).map(([k]) => k).slice(0,3).join(", ") || "no low checks" });
  else t.push({ label:"OpenSSF Scorecard", value:"No result", state:"none", word:"Not scored", sub:"Only github.com and gitlab.com projects are scored" });
  return t;
}

// ---------- Procurement officer review (areas switched on by the answers) ----------

function renderUpstream(c){
  const S = c.signals; if(!S || !S.ok) return `<section class="card stack" id="upstream"><h3>Feedback to the project</h3><p class="small muted">Once the repository has been read, the gaps it shows can be flagged to the project owners from here.</p></section>`;

  if(!c.upstream.selected) c.upstream.selected = gaps.map(g => g.id);
  const sel = gaps.filter(g => c.upstream.selected.includes(g.id)); const draft = upstreamIssueText(c, sel);

  return `<section class="card stack" id="upstream">
    <div><p class="eyebrow">Route to the project owners</p><h3>Feedback to the project</h3><p class="small muted">What the repository is missing from an institutional buyer's point of view. Tick what to send; the message is drafted below and can be edited, copied, or opened as an issue on ${h(S.host)}.</p></div>
    ${gaps.length ? `<div class="gaps">${gaps.map(g => `<label class="check gap"><input type="checkbox" data-gap="${g.id}" ${c.upstream.selected.includes(g.id)?"checked":""}><span><b>${h(g.title)}</b><span class="why">${h(g.ask)}</span></span></label>`).join("")}</div>` : `<p class="small">Nothing to flag: the signals the toolkit checks are all present.</p>`}
    ${gaps.length ? `<label class="field">Message <span class="hint">${c.upstream.text != null ? `Edited. <a href="#review" data-act="upstream-reset">Restore the drafted text</a>` : "Drafted from the ticked items. Edit freely."}</span><textarea id="upstreamText" rows="12" style="font-size:13.5px">${h(body)}</textarea></label>

    <p class="small muted">The issue link opens the project's tracker with the title and text filled in; nothing is posted until you submit it there.</p>` : ""}

    ["People", `${S.people.contributorsCount != null ? S.people.contributorsCount + (S.people.contributorsCapped?"+":"") + " contributors; top contributor " + pct(S.people.topShare) : "contributor data not available"}; ${S.people.recentAuthors ?? "—"} distinct authors in 90 days`],

    S.scorecard ? ["Scorecard checks", Object.entries(S.scorecard.checks).sort((a,b)=>(a[1].score??-1)-(b[1].score??-1)).map(([k,v]) => `${k} ${v.score==null||v.score<0?"n/a":v.score}`).join(" · ")] : null

function tenAnswer(c, t){

  return f[t.key] || "—";
}

// ---------- About / Sources ----------
function viewAbout(){
  return `
  <section class="stack"><p class="eyebrow">About</p><h1>About this pilot portal</h1><p class="muted" style="max-width:64ch">This prototype explores how an open source software or hardware request could move through an academic procurement process while using existing assessment resources rather than creating a new maturity framework.</p></section>
  <div class="grid2">
    <section class="card stack"><p class="eyebrow">Responsibilities</p><h3>Who provides which information?</h3>
      <div class="grid2"><div><h4>Researcher / requester</h4><p class="small muted">Describes the request: the research need, technical context, candidate software or hardware, links to project information, intended use, support required, exposure, licensing, continuity, resources, and the responsible contact. Three answers are drafted from the repository for the researcher to confirm or correct.</p></div>
      <div><h4>Procurement officer</h4><p class="small muted">Checks whether the evidence is sufficient against the source crosswalk, reviews providers and purchasing terms, coordinates university reviews, and confirms that responsibilities and ongoing costs are clear.</p></div></div></section>
    <section class="card stack"><p class="eyebrow">The pathway</p><h3>What the portal is testing</h3><p class="small muted">The FIN pilot tests whether a request can move through a documented pathway from <b>researcher input → procurement review → provider and contract review → institutional ownership</b>. Questions that require deeper technical, security, privacy, accessibility or legal analysis are referred to the institution's existing specialist processes; the toolkit marks them.</p></section>
  </div>
  <section class="card stack"><p class="eyebrow">Assessment routes</p><h3>Start light and expand only when needed</h3>
    <div class="grid2"><div><h4>Light review</h4><p class="small muted">When baseline evidence is sufficient: recorded baseline evidence, relevant project questions, and the institutional checks appropriate to the proposed use.</p></div>
    <div><h4>Extended review — triggered route</h4><p class="small muted">Additional assessment when the software or hardware handles sensitive data, supports an essential shared service, creates a material dependency, or when baseline checks raise concerns. Custom development requires clarification of scope; it does not automatically mean every specialist review is needed.</p></div></div>
    <p class="small muted">Automation is most useful for objective repository signals such as license information, recent maintenance activity, security-policy files, standard project documentation, and documentation of maintainer contact routes. Maintainer availability requires human confirmation. Governance, meaningful prior institutional use, research fit, and long-term ownership still require human judgment.</p></section>
  <section class="card stack"><p class="eyebrow">What is drafted automatically</p><h3>From a repository link</h3>
    <div class="grid3">
      <div><h4>GitHub</h4><p class="small muted">Repository metadata, community profile files, license detection, releases and tags, commits in the last 90 days, contributor concentration, issue and pull-request throughput over 180 days, root and <span class="mono">.github</span> listings (security policy, governance, roadmap, citation, funding, CI workflows, dependency bots, dependency manifests, hardware design files).</p></div>
      <div><h4>GitLab and Codeberg</h4><p class="small muted">Project metadata and license, repository tree, releases, commits, contributors and issue statistics (GitLab); repository, tree, releases, commits and closed issues (Gitea/Forgejo). Self-hosted GitLab instances work when their API is public.</p></div>
      <div><h4>OpenSSF Scorecard</h4><p class="small muted">Public Scorecard results for github.com and gitlab.com projects, each attached to the crosswalk question it informs.</p></div>
    </div>
    <p class="small muted">Licensing, maintenance and resources receive a plain-language draft built from these signals, with the signals listed underneath. The draft is editable and is marked as a draft in the record until changed. Signals are dated; re-read before a decision.</p></section>
  <section class="card stack"><h3>Using this prototype</h3><p class="small muted">Nothing is stored: the assessment lives in the page until you leave it, so download the record as Markdown, JSON or PDF. Public repository checks run from your browser against public APIs and count against those services' anonymous rate limits (GitHub: 60 requests an hour without a token; an assessment uses about a dozen). Submission and institutional approval systems are not connected.</p></section>`;
}
function viewSources(){
  const rows = SRC_ORDER.map(k => SOURCES[k]).filter(Boolean);
  return `
  <section class="stack"><p class="eyebrow">Sources</p><h1>Resources informing the questions</h1><p class="muted" style="max-width:64ch">The request form sits on a criterion-level comparison of these initiatives. Question wording is a concise paraphrase; original criterion IDs are retained in the crosswalk. Absence of a match does not prove absence from every version of a source.</p>
  <p><a class="btn" href="${CROSSWALK_URL}" target="_blank" rel="noopener">Open the question crosswalk ↗</a></p></section>
  <section class="card stack"><h3>Reading key</h3><dl class="kv" style="display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:13.5px">${Object.entries(READING_KEY).map(([k,v]) => `<dt><span class="chip ${k}">${k}</span></dt><dd style="margin:0">${h(v)}</dd>`).join("")}</dl></section>
  <section class="card stack"><h3>Initiatives and resources</h3>${rows.map(s => `<details class="src"><summary>${h(s.name)} <span class="small muted" style="font-weight:400">· ${h(s.scope)}</span></summary><p>${h(s.full)}${s.url ? ` — <a href="${h(s.url)}" target="_blank" rel="noopener">${h(s.url)}</a>` : ""}</p><p>Informs: ${QUESTIONS.filter(q => q.src[Object.keys(SOURCES).find(k=>SOURCES[k]===s)]).map(q=>q.id).join(", ") || "—"}</p></details>`).join("")}</section>`;
}

// ---------- Actions ----------
function startCase(repoUrl, candidate){
  CASE = newCase(repoUrl, candidate);
  if(repoUrl){ const ref = parseRepoUrl(repoUrl); if(ref && !candidate) CASE.form.candidate = ref.repo; }
  persist(CASE);
  if(location.hash === "#form") route(); else location.hash = "#form";
  if(CASE.form.repoUrl && !HOSTED) setTimeout(runFetch, 30);
}
document.addEventListener("submit", (e) => {
  if(e.target.id !== "startForm") return;
  e.preventDefault();
  const url = $("#startUrl").value.trim(); const nameEl = $("#startName"); const tokenEl = $("#startToken");
  if(tokenEl) SETTINGS.ghToken = tokenEl.value.trim();
  if(url && !parseRepoUrl(url)){ toast("The link needs an owner and a project, e.g. https://github.com/org/project"); return; }
  startCase(url, nameEl ? nameEl.value.trim() : "");
});

document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act; const c = CASE;
  if(act === "role-researcher" || act === "role-reviewer"){ e.preventDefault(); if(!CASE || CASE.example) CASE = mockCase(); location.hash = act === "role-researcher" ? "#form" : "#review"; return; }
  if(act === "start-own"){ e.preventDefault(); CASE = null; location.hash = "#home"; route(); $("#startUrl").focus(); return; }
  if(act === "no-repo"){ e.preventDefault(); const x = $("#startExtra"); x.hidden = false; x.innerHTML = `<label class="field">Project, device or service you are considering <input type="text" id="startName" placeholder="e.g. a lab-built incubator, or “Unknown”"></label><p class="small muted">Without a repository link nothing is drafted; you answer everything yourself. You can add a link later under the project details.</p>`; $("#startName").focus(); return; }
  if(act === "token"){ e.preventDefault(); const x = $("#startExtra"); x.hidden = false; x.innerHTML = `<label class="field">GitHub token <span class="hint">optional; kept in memory for this visit only and sent only to api.github.com. Raises the anonymous limit of 60 requests an hour.</span><input type="password" id="startToken" value="${h(SETTINGS.ghToken)}" autocomplete="off" placeholder="github_pat_…"></label>`; $("#startToken").focus(); return; }
  if(!c) return;
  if(act === "fetch"){ e.preventDefault(); const u = $("#repoUrlField"); if(u) c.form.repoUrl = u.value.trim(); return runFetch(); }
  if(act === "showlog"){ e.preventDefault(); const l = $("#fetchLogBox"); if(l) l.hidden = !l.hidden; return; }
  if(act === "redraft"){ e.preventDefault(); const k = b.dataset.key; c.form[k] = c.form.drafts[k]; persist(c); route(); return; }
  if(act === "upstream-copy"){ const txt = $("#upstreamText").value; try { await navigator.clipboard.writeText(txt); toast("Message copied"); } catch(err){ $("#upstreamText").select(); toast("Select-all and copy; the clipboard was refused."); } return; }
  if(act === "upstream-reset"){ e.preventDefault(); c.upstream.text = null; persist(c); route(); return; }
  if(act === "upstream-md"){ const gaps = detectGaps(c.signals).filter(g => c.upstream.selected.includes(g.id)); const d = upstreamIssueText(c, gaps); return download(`${slug(c.form.candidate)}-upstream-feedback.md`, `# ${d.title}\n\n${$("#upstreamText") ? $("#upstreamText").value : d.body}`, "text/markdown"); }
  if(act === "export-json") return download(`${slug(caseTitle(c))}.fin-assessment.json`, JSON.stringify(c, null, 2), "application/json");
  if(act === "export-md") return download(`${slug(caseTitle(c))}.md`, caseMarkdown(c), "text/markdown");
  if(act === "print"){ window.print(); return; }
});
document.addEventListener("toggle", (e) => { const d = e.target; if(d.dataset && d.dataset.evkey && CASE){ CASE.ui.ev[d.dataset.evkey] = d.open; } }, true);

function refreshRoute(c){ const box = $("#routeBox"); if(box) box.innerHTML = routeBanner(computeRoute(ctxOf(c), c.signals, {})); }

document.addEventListener("change", (e) => {
  const t = e.target; const c = CASE; if(!c) return;
  if(t.dataset.areaVerdict){ const id = t.dataset.areaVerdict; c.answers[id] = Object.assign({}, c.answers[id], { verdict: t.value }); persist(c); const art = t.closest(".area"); if(art) art.className = "area " + t.value; }
  else if(t.dataset.f){ c.form[t.dataset.f] = t.value; persist(c); if(["type","data","systems","impact","clinical"].includes(t.dataset.f)) refreshRoute(c); }
  else if(t.dataset.fs){ const s = new Set(c.form.support||[]); if(t.checked) s.add(t.dataset.fs); else s.delete(t.dataset.fs); if(t.dataset.fs === "none" && t.checked) { s.clear(); s.add("none"); document.querySelectorAll('[data-fs]').forEach(x => { if(x.dataset.fs !== "none") x.checked = false; }); } else if(t.checked) { s.delete("none"); const n = document.querySelector('[data-fs="none"]'); if(n) n.checked = false; } c.form.support = SUPPORT.map(([k]) => k).filter(k => s.has(k)); persist(c); refreshRoute(c); }
  else if(t.dataset.gap){ const set = new Set(c.upstream.selected); if(t.checked) set.add(t.dataset.gap); else set.delete(t.dataset.gap); c.upstream.selected = detectGaps(c.signals).map(g => g.id).filter(id => set.has(id)); c.upstream.text = null; persist(c); const top = window.scrollY; route(); window.scrollTo({ top }); }
  else if(t.hasAttribute("data-upstream-sent")){ c.upstream.sent = t.checked; persist(c); }
  else if(t.dataset.own){ c.ownership[t.dataset.own] = t.value; persist(c); }
  else if(t.name === "decision"){ c.ownership.decision = t.value; persist(c); }
});
document.addEventListener("input", (e) => {
  const t = e.target; const c = CASE; if(!c) return;
  if(t.id === "upstreamText"){ c.upstream.text = t.value; persist(c); }
  else if(t.dataset.areaNote){ c.answers[t.dataset.areaNote] = Object.assign({}, c.answers[t.dataset.areaNote], { note: t.value }); persist(c); }
  else if(t.dataset.own){ c.ownership[t.dataset.own] = t.value; persist(c); }
  else if(t.dataset.f){ c.form[t.dataset.f] = t.value; persist(c); if(t.dataset.f === "objective" || t.dataset.f === "candidate"){ const h1 = $("#caseTitle"); if(h1) h1.textContent = caseTitle(c); } }
});

async function runFetch(){
  const c = CASE; if(!c || !c.form.repoUrl) return;
  const ref = parseRepoUrl(c.form.repoUrl); if(!ref){ toast("The link needs an owner and a project, e.g. https://github.com/org/project"); return; }
  const btn = $("#fetchBtn"); if(btn){ btn.disabled = true; btn.textContent = "Reading…"; }
  toast("Reading the repository…");
  const token = ref.kind === "github" ? (SETTINGS.ghToken||"") : "";
  let S; try { S = await fetchRepositoryEvidence(ref, token); } catch(err){ S = { ok:false, errors:[err.message||String(err)] }; }
  if(S.ok){
    c.signals = S; c.evidence = deriveEvidence(S); c.example = false;
    const d = draftAnswers(S); c.form.drafts = c.form.drafts || {};
    ["licensing","maintenance","resources"].forEach(k => { const cur = (c.form[k]||"").trim(); if(!cur || cur === c.form.drafts[k]) c.form[k] = d[k]; c.form.drafts[k] = d[k]; });
    if(!c.form.candidate || c.form.candidate === ref.repo) c.form.candidate = ref.repo;
    if(c.form.type === "software" && S.files.hardware && S.files.hardware.length >= 2) c.form.type = "both";
    persist(c); toast(`Read ${S.source}. Licensing, maintenance and resources are drafted; please check them.`);
  } else { c.signals = Object.assign({ ok:false }, S); persist(c); }
  if(location.hash === "#form" || location.hash === "#review") route();
}

// ---------- Exports ----------
function slug(s){ return String(s||"assessment").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "assessment"; }
async function download(name, text, type){
  if(HOSTED){ try { const dl = await window.claude.use("downloads"); if(dl){ await dl.save({ filename: name, data: text }); return; } } catch(e){ if(e && e.code !== "not_granted") toast("Download was not completed."); return; } }
  const blob = new Blob([text], { type: type + ";charset=utf-8" }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function caseMarkdown(c){
  const S = c.signals; const E = c.evidence || {}; const R = computeRoute(ctxOf(c), S, {}); const own = c.ownership || {};
  const L = [];
  L.push(`# ${caseTitle(c)}`, "", `FIN open source procurement toolkit — assessment record`, "", `- Candidate: ${tenAnswer(c, TEN[2])}`, `- Contact: ${c.form.contact || "—"}`, `- Date: ${fmtDate(c.updatedAt || c.createdAt)}`, "");
  L.push(`## Route and decision`, "", `Route: **${R.route === "light" ? "Light review" : R.route === "extended" ? "Extended review" : "Clarify scope"}**`, "");
  R.triggers.forEach(t => L.push(`- ${t.text}${t.refer ? " (refer: " + t.refer + ")" : ""}`)); if(!R.triggers.length) L.push("- No extended-review triggers.");
  L.push("", `Decision: ${DECISION[own.decision||"open"]}`, `Decision owner: ${own.owner||"—"}`, `Operational owner: ${own.operator||"—"}`, `Conditions: ${own.conditions||"—"}`, `Review: ${own.reviewDate||"—"}${own.reviewTrigger ? " · " + own.reviewTrigger : ""}`, "");
  L.push(`## Researcher's answers`, ""); TEN.forEach(t => { L.push(`**${String(t.n).padStart(2,"0")} ${t.q}**`, "", tenAnswer(c,t) + (t.auto && c.form.drafts && c.form.drafts[t.key] && c.form[t.key] === c.form.drafts[t.key] ? " _(drafted from repository signals, unedited)_" : ""), ""); });
  if(S && S.ok){ L.push(`## Repository evidence snapshot`, "", `Fetched ${fmtDate(S.fetchedAt)} from ${S.source}.${S.scorecard ? ` OpenSSF Scorecard ${S.scorecard.score != null ? S.scorecard.score.toFixed(1) : "—"}/10 (${fmtDate(S.scorecard.date)}).` : ""}`, ""); evidenceSnapshotRows(S).forEach(([k,v]) => L.push(`- ${k}: ${v}`)); if(S.errors.length) L.push(`- Not retrieved: ${S.errors.join("; ")}`); L.push(""); }
  L.push(`## Procurement review`, "", `| Area | Mark | Notes and signals |`, `|---|---|---|`);
  activeAreas(c).forEach(a => { const ans = c.answers[a.id]||{}; const sp = areaSpecialist(a, c); const sum = areaSignalSummary(a, c); L.push(`| ${a.name}${sp ? " (→ " + sp + ")" : ""} | ${ans.verdict ? AREA_VLABEL[ans.verdict] : "open"} | ${[ans.note, sum ? `${sum.count} signals: ${sum.ok} positive${sum.mixed ? ", " + sum.mixed + " to check" : ""}${sum.bad ? ", " + sum.bad + " missing or negative" : ""}` : ""].filter(Boolean).join(" — ").replace(/\|/g,"\\|").replace(/\n/g," ")} |`); });
  if(inactiveAreas(c).length) L.push("", `Not triggered: ${inactiveAreas(c).map(a => a.name).join(", ")}.`);
  L.push("");
  if(S && S.ok && c.upstream && c.upstream.selected && c.upstream.selected.length){ L.push(`## Feedback to the project${c.upstream.sent ? " (sent)" : " (drafted)"}`, ""); detectGaps(S).filter(g => c.upstream.selected.includes(g.id)).forEach(g => L.push(`- **${g.title}.** ${g.ask}`)); L.push(""); }
  L.push(`---`, `Question set aligned across HEOSAT, CHAOSS, OpenSSF, OSOR, IDB, HECVAT, OpenChain, OSBA and open hardware sources. Crosswalk: ${CROSSWALK_URL}`);
  return L.join("\n");
}

route();
</script></body></html>
