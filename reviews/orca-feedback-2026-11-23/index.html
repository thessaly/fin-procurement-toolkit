<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FIN | Open Source Procurement Toolkit</title>
<meta name="description" content="Institutional assessment of research software and hardware. Repository evidence is fetched automatically; judgment stays with people.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/* Layout: a quiet institutional form. One wide column; the case view splits into a sticky summary rail and a long questionnaire. */
:root{
  color-scheme:light;
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#e9ecf2; --fg:#1b2130; --muted:#4f5869; --line:#cfd4df; --line-strong:#7f879b;
  --accent:#2a4a8b; --accent-ink:#ffffff; --accent-soft:#e3e9f6; --accent-soft-ink:#1f3a70;
  --ok:#1f6b3d; --ok-soft:#e3f2e8; --warn:#875012; --warn-soft:#f8edd8; --bad:#9f2f22; --bad-soft:#f8e3df; --info:#2b5a7d; --info-soft:#e2ecf4;
  --display:"Space Grotesk","IBM Plex Sans",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --rail:300px;
}

*{box-sizing:border-box} html{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)} a:hover{text-decoration-thickness:2px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,40px)} h2{font-size:22px} h3{font-size:17px} h4{font-size:15px;font-family:var(--body);font-weight:600}
p{margin:0} .muted{color:var(--muted)} .small{font-size:13px} .mono{font-family:var(--mono);font-size:12.5px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;left:-9999px}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-family:var(--display);font-weight:600}
.brand .mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.05em}
.brand .ver{font:11px var(--mono);color:var(--muted);letter-spacing:.1em;margin-left:4px}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{padding:7px 11px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:500}
nav.main a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-soft-ink)}

main{padding-block:28px 64px}
.view{display:grid;gap:22px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.tight{padding:14px 16px}
.stack{display:grid;gap:12px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}

.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;text-decoration:none;color:inherit;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:6px 10px;font-size:13px} .btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.danger{color:var(--bad)}

label.field{display:grid;gap:6px;font-size:13.5px;font-weight:500}
label.field span.hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=url],input[type=password],input[type=date],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);min-width:0}
textarea{min-height:72px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.check input{margin-top:3px;flex:none}
.check b{font-weight:600} .check .why{display:block;color:var(--muted);font-size:13px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:7px 12px;cursor:pointer;font-size:13.5px;border-right:1px solid var(--line);display:flex;gap:6px;align-items:center;background:var(--surface)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.6;border:1px solid transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.outline{background:transparent;border-color:var(--line-strong);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font:11.5px var(--mono);padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);background:var(--surface-2);cursor:help}
.chip.M{border-color:var(--accent);color:var(--accent-soft-ink);background:var(--accent-soft)} .chip.E{border-color:var(--info);color:var(--info);background:var(--info-soft)} .chip.U{border-style:dashed}

/* stage header strip */
.pathway{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pathway .step.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.stageh{font-size:15px;margin-top:8px}
details.card>summary{cursor:pointer}
.pathway .step{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;gap:3px;min-width:0;text-decoration:none;color:inherit}
.pathway .step .n{font:11px var(--mono);color:var(--muted)} .pathway .step b{font-family:var(--display);font-weight:600;font-size:14px;line-height:1.2}
.pathway .step .prog{height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden;margin-top:4px} .pathway .step .prog i{display:block;height:100%;background:var(--accent)}
@media (max-width:760px){ .pathway{grid-template-columns:repeat(2,minmax(0,1fr))} .pathway .step:last-child{grid-column:span 2} }

/* case layout */
.case{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:22px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:14px;max-height:calc(100vh - 90px);overflow:auto}
@media (max-width:900px){ .case{grid-template-columns:1fr} .rail{position:static;max-height:none} }
.rail .k{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--line)} .rail .k:last-child{border-bottom:0}
.rail .k b{font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}

.stage{display:grid;gap:14px;scroll-margin-top:90px}
.stage-head{display:grid;gap:4px;padding:6px 0 0}
.stage-head .who{font-size:13px;color:var(--muted)}
.domain{display:grid;gap:10px}
.domain h4{color:var(--muted);font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding-top:6px}

.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;border-left:4px solid var(--line)}
.q[data-v="yes"]{border-left-color:var(--ok)} .q[data-v="partial"]{border-left-color:var(--warn)} .q[data-v="no"]{border-left-color:var(--bad)} .q[data-v="na"]{border-left-color:var(--line-strong)}
.q .qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q .qid{font:12px var(--mono);color:var(--muted);min-width:34px} .q .qt{font-weight:600;font-size:15px;flex:1 1 300px;min-width:0}
.q .srcs{display:flex;gap:4px;flex-wrap:wrap}
.q .help{font-size:13px;color:var(--muted)}
.ev{display:grid;gap:4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.ev .evi{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;min-width:0}
.ev .dot{flex:none;width:16px;height:16px;border-radius:50%;margin-top:3px;background:var(--surface-2);color:var(--muted);display:grid;place-items:center;font:700 10px var(--mono);line-height:1}
.ev .dot::before{content:"·"} .ev .dot.ok::before{content:"✓"} .ev .dot.bad::before{content:"✗"} .ev .dot.mixed::before{content:"~"}
.ev .dot.ok{background:var(--ok);color:#fff} .ev .dot.bad{background:var(--bad);color:#fff} .ev .dot.mixed{background:var(--warn);color:#fff}
.ev .evl{color:var(--muted);flex:0 0 auto;max-width:45%} .ev .evv{min-width:0;overflow-wrap:anywhere} .ev .evs{font:11px var(--mono);color:var(--muted);margin-left:auto;flex:none}
.ev .evcap{font-size:12px;color:var(--muted);padding-top:4px;border-top:1px dashed var(--line);margin-top:4px}
.suggest{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.q .ans{display:grid;gap:8px}
.q textarea{min-height:44px}
.q .note-label{font-size:12.5px;color:var(--muted)}
.specialist{font-size:12px;color:var(--info)}

.route{display:grid;gap:10px}
.route .big{font-family:var(--display);font-size:20px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.route ul{margin:0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}
.route li .kind{font:11px var(--mono);color:var(--muted);margin-right:6px}

.cases{display:grid;gap:8px}
.cases a.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:inherit}
.cases a.item:hover{border-color:var(--accent)}
.cases .nm{font-weight:600;font-family:var(--display)} .cases .mt{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}

table{border-collapse:collapse;width:100%;font-size:13.5px} th,td{text-align:left;vertical-align:top;padding:7px 8px;border-bottom:1px solid var(--line)} th{font-weight:600;font-size:12.5px;color:var(--muted)}
.tablewrap{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.log{font:12.5px/1.5 var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:160px;overflow:auto;white-space:pre-wrap}
details.src{border-top:1px solid var(--line);padding:10px 0} details.src summary{cursor:pointer;font-weight:600;font-family:var(--display)} details.src p{font-size:13.5px;color:var(--muted);padding-top:4px}

.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:grid;gap:22px;max-width:900px}
.report h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:6px}
.report .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:13.5px} .report .kv dt{color:var(--muted)} .report .kv dd{margin:0;overflow-wrap:anywhere}
.v{font:12px var(--mono);padding:1px 6px;border-radius:4px;white-space:nowrap} .v.yes{background:var(--ok-soft);color:var(--ok)} .v.partial{background:var(--warn-soft);color:var(--warn)} .v.no{background:var(--bad-soft);color:var(--bad)} .v.na{background:var(--surface-2);color:var(--muted)} .v.unset{border:1px dashed var(--line-strong);color:var(--muted)}


/* ---- simplified interface ---- */
.hero{display:grid;gap:14px;max-width:760px;padding-block:18px 8px}
.hero .lead{font-size:16.5px;max-width:62ch}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding-block:6px}
.role{display:grid;gap:6px;padding:18px 20px;border:1px solid var(--line-strong);border-radius:var(--r);background:var(--surface);text-decoration:none;color:inherit}
.role:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.role b{font-family:var(--display);font-size:20px;font-weight:600}
.start{display:flex;gap:8px;flex-wrap:wrap}
.start input{flex:1 1 320px;padding:13px 14px;font-size:16px;border-radius:10px}
.btn.big{padding:13px 20px;font-size:16px;border-radius:10px}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;max-width:980px}
.howto .step{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.howto .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 13px var(--mono)}
.howto b{font-family:var(--display);font-weight:600;display:block;margin-bottom:2px}

.formv{display:grid;gap:18px;max-width:900px}
.casehead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.qcard{display:grid;gap:10px;padding:20px 22px}
.qcard h3{font-size:19px}
.qcard .hint{font-weight:400;color:var(--muted);font-size:13.5px;line-height:1.5}
.qcard label.field{gap:6px}
.draft{font-weight:400;font-size:12.5px;color:var(--info)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.check input{margin-top:2px}
.evd{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.evd summary{cursor:pointer;font-size:13.5px;font-weight:500}
.evd .ev{border:0;padding:8px 0 0;background:transparent}

.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){ .glance{grid-template-columns:repeat(2,minmax(0,1fr))} }
.urlfield{grid-column:1 / -1} .urlfield .row{flex-wrap:nowrap} .urlfield .btn{white-space:nowrap;flex:none}
.tile{display:grid;gap:3px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.tile .tl{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .tv{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.tile .ts{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.tile .ts i{width:14px;height:14px;border-radius:50%;background:var(--line-strong);flex:none;color:#fff;font:700 9px var(--mono);display:grid;place-items:center;font-style:normal}
.tile.ok .ts i::before{content:"✓"} .tile.warn .ts i::before{content:"!"} .tile.bad .ts i::before{content:"✗"}
.tile.ok .ts{color:var(--ok)} .tile.ok .ts i{background:var(--ok)} .tile.warn .ts{color:var(--warn)} .tile.warn .ts i{background:var(--warn)} .tile.bad .ts{color:var(--bad)} .tile.bad .ts i{background:var(--bad)} .tile.none .ts{color:var(--muted)}
.tile .tsub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

.banner{padding:12px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:14px;line-height:1.5}
.banner b{font-family:var(--display);font-weight:600;display:block;margin-bottom:2px;font-size:15px}
.banner.route-light{border-color:var(--ok);background:var(--ok-soft)} .banner.route-extended{border-color:var(--warn);background:var(--warn-soft)} .banner.route-clarify,.banner.info{border-color:var(--info);background:var(--info-soft)} .banner.warn{border-color:var(--warn);background:var(--warn-soft)}

.listbar{padding:4px 0}
.seg.small label{padding:5px 10px;font-size:13px}
.stage{gap:8px} .stage-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:14px}
.qlist{display:grid;gap:4px}
.qr{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.qr.open{border-color:var(--line-strong)}
.qrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto 16px;gap:10px;align-items:center;padding:8px 10px;cursor:pointer}
.qrow:hover{background:var(--bg)}
.st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--mono);border:1px solid var(--line-strong);color:var(--muted);background:var(--surface)}
.st.yes{background:var(--ok);border-color:var(--ok);color:#fff} .st.partial{background:var(--warn);border-color:var(--warn);color:#fff} .st.no{background:var(--bad);border-color:var(--bad);color:#fff} .st.na{background:var(--surface-2);color:var(--muted)}
.st.sug{background:transparent;border-style:dashed} .st.yes.sug{color:var(--ok)} .st.partial.sug{color:var(--warn)} .st.no.sug{color:var(--bad)}
.qtxt{display:grid;gap:1px;min-width:0;font-size:14px;line-height:1.35}
.qtxt .qid{font:11px var(--mono);color:var(--muted);margin-right:6px}
.qev{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tenref{font:11px var(--mono);color:var(--accent-soft-ink);background:var(--accent-soft);padding:0 5px;border-radius:4px;margin-right:6px}
.vbtns{display:inline-flex;gap:3px}
.vb{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:600 13px var(--mono);color:var(--muted)}
.vb:hover{border-color:var(--line-strong)}
.vb.on.yes{background:var(--ok);border-color:var(--ok);color:#fff} .vb.on.partial{background:var(--warn);border-color:var(--warn);color:#fff} .vb.on.no{background:var(--bad);border-color:var(--bad);color:#fff}
.caret{color:var(--muted);transition:transform .15s} .qr.open .caret{transform:rotate(180deg)}
.qdetail{display:grid;gap:10px;padding:4px 12px 14px 46px;border-top:1px solid var(--line)}
@media (max-width:640px){ .qrow{grid-template-columns:26px minmax(0,1fr) 16px} .vbtns{grid-column:2;justify-self:start} .qdetail{padding-left:12px} .qev{white-space:normal} }
.areas{display:grid;gap:12px}
.gaps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px}
.gap .why{font-size:12.5px}
.area{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.area.ok{border-left-color:var(--ok)} .area.followup{border-left-color:var(--warn)} .area.refer{border-left-color:var(--info)} .area.na{border-left-color:var(--line-strong)}
.ahead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ahead h3{font-size:17px}
.sig{display:flex;align-items:center;gap:6px;font-weight:500} .sig i{width:14px;height:14px;border-radius:50%;background:var(--line-strong);flex:none;color:#fff;font:700 9px var(--mono);display:grid;place-items:center;font-style:normal} .sig.ok i::before{content:"✓"} .sig.warn i::before{content:"!"} .sig.bad i::before{content:"✗"} .sig.ok{color:var(--ok)} .sig.ok i{background:var(--ok)} .sig.warn{color:var(--warn)} .sig.warn i{background:var(--warn)} .sig.bad{color:var(--bad)} .sig.bad i{background:var(--bad)}

/* ---- visual refresh: ink, sea-teal, one dark start panel; no mono, no caps labels ---- */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --surface-2:#e6edef; --fg:#0f1b2d; --muted:#51606f; --line:#dbe3e7; --line-strong:#9fb0b8;
  --accent:#0a6f78; --accent-ink:#ffffff; --accent-soft:#dff1f0; --accent-soft-ink:#07515a; --mint:#8fe3d6;
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif; --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
body{font:16px/1.55 var(--body)}
h1{font-size:clamp(36px,5.4vw,58px);font-weight:700;letter-spacing:-.03em;line-height:1.02}
h2{letter-spacing:-.02em} h3{letter-spacing:-.015em}
.small{font-size:14px}
.eyebrow{font-family:var(--body);font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--accent)}
header.top{background:rgba(255,255,255,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand .mark{border-radius:9px;background:var(--fg);font-weight:700;font-size:11px}
.brand .ver{font-size:12px;letter-spacing:0;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
nav.main a{border-radius:999px;padding:7px 14px}
nav.main a[aria-current="page"]{background:var(--fg);color:#fff}
main{padding-block:36px 96px}
.card{border-radius:16px;border-color:var(--line);padding:22px}
.btn{border-radius:999px;padding:10px 18px;font-weight:600;border-color:var(--line-strong)}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--fg);border-color:var(--fg);color:#fff} .btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn.small{padding:7px 14px;font-size:13.5px}
label.field{font-size:14.5px;font-weight:600;gap:8px}
input[type=text],input[type=url],input[type=password],input[type=date],select,textarea{padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-weight:400}
input[type=text]:focus,input[type=url]:focus,input[type=password]:focus,input[type=date]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{min-height:96px}
.check{border-radius:12px;padding:12px 14px;border-width:1.5px;cursor:pointer}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg{border-radius:12px;border-color:var(--line)}
.pill.auto{background:var(--accent-soft);color:var(--accent-soft-ink);font-size:12.5px;padding:3px 10px}

/* start page */
.hero{max-width:860px;gap:20px;padding-block:28px 4px}
.hero .lead{font-size:21px;line-height:1.4;max-width:46ch;color:var(--fg)}
.startpanel{display:grid;gap:12px;background:var(--fg);color:#fff;border-radius:22px;padding:26px 28px}
.startpanel label{font:600 21px/1.2 var(--display);letter-spacing:-.015em}
.startpanel .start{flex-wrap:nowrap} .startpanel .start input{flex:1 1 auto;border:0;border-radius:14px;padding:16px 18px;font-size:17px;color:var(--fg)}
.startpanel .start input:focus{box-shadow:0 0 0 4px rgba(143,227,214,.45)}
.startpanel .btn.go{background:var(--mint);border-color:var(--mint);color:var(--fg);padding:16px 26px;font-size:17px;border-radius:14px}
.startpanel .btn.go:hover{background:#fff;border-color:#fff}
.startpanel p{color:rgba(255,255,255,.78)} .startpanel a{color:#fff}
.startpanel ul{list-style:none;margin:0;padding:0;display:flex;gap:8px 20px;flex-wrap:wrap;font-size:14.5px;color:rgba(255,255,255,.9)}
.startpanel li::before{content:"✓";color:var(--mint);font-weight:700;margin-right:7px}
.startpanel .card{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
@media (max-width:560px){ .startpanel .start{flex-wrap:wrap} }
.roles{gap:14px}
.role{border-radius:16px;border:1.5px solid var(--line);padding:20px 22px}

.howto{gap:22px;max-width:none;margin-top:18px}

.howto .n{width:auto;height:auto;background:none;color:var(--accent);place-items:start;font:700 30px/1 var(--display)}
.howto b{font-size:17px}

/* request form */
.formv{max-width:820px;gap:20px}
.casehead h1{letter-spacing:-.02em;line-height:1.1}
.pathway{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pathway .step{display:inline-flex;align-items:baseline;gap:6px;border:0;background:none;padding:5px 12px;border-radius:999px;color:var(--muted);box-shadow:none}
.pathway .step b{font:600 13.5px var(--body)} .pathway .step .n{font:600 13.5px var(--body)} .pathway .step .small{display:none}
.pathway .step.cur{background:var(--accent-soft);color:var(--accent-soft-ink);box-shadow:none} .pathway .step.cur .n{color:inherit}
.stepper{display:grid;gap:8px}
.stepper ol{list-style:none;display:flex;gap:6px;margin:0;padding:0}
.stepper li{flex:1 1 0;min-width:0}
.stepper button{display:grid;gap:6px;width:100%;padding:0;border:0;background:none;text-align:left;font-size:13px;font-weight:500;color:var(--muted)}
.stepper button::before{content:"";height:6px;border-radius:3px;background:var(--surface-2)}
.stepper button.done::before{background:var(--accent)} .stepper button.cur::before{background:var(--fg)}
.stepper button.cur{color:var(--fg);font-weight:700} .stepper button:hover{color:var(--fg)}
.stepper .au{color:var(--accent);font-weight:600}
#stepStatus{font-size:14px;color:var(--muted)}
.autobox{background:var(--accent-soft);color:var(--accent-soft-ink);border-radius:16px;padding:18px 22px;display:grid;gap:8px}
.autobox>b{font:700 18px/1.2 var(--display);letter-spacing:-.01em}
.autobox ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px 18px;font-size:14.5px}
.autobox li{display:flex;gap:8px;align-items:baseline} .autobox li::before{content:"✓";font-weight:700}
.autobox.slim{display:block;padding:10px 16px;font-size:14.5px;font-weight:500}
.autobox.empty{background:var(--surface);border:1.5px dashed var(--line-strong);color:var(--fg)}
.qcard{padding:30px 32px;gap:14px;border-radius:20px;border-color:transparent;box-shadow:0 1px 2px rgba(15,27,45,.05),0 18px 40px -24px rgba(15,27,45,.28)}
.qcard h3{font-size:28px;line-height:1.1;letter-spacing:-.025em}
.qcard h3:focus{outline:none}
.qcard .hint{font-size:14.5px}
.stepnav{position:sticky;bottom:0;z-index:10;justify-content:space-between;padding:14px 0 16px;background:linear-gradient(to top,var(--bg) 72%,rgba(243,246,247,0))}
.stepnav .btn{padding:13px 24px;font-size:16px}
.formfoot{font-size:14px;color:var(--muted)} .formfoot .btn{padding:7px 14px;font-size:13.5px;font-weight:500}
.banner{border-radius:14px;padding:14px 18px} .banner.info{border-color:transparent;padding:10px 16px} .banner.info b{display:inline;margin-right:6px}
.tile{border-radius:14px} .tile .tl{font:600 13px var(--body);letter-spacing:0;text-transform:none}
.evd{border-radius:12px} .ev{border-radius:12px}
.ev .evs{font:500 12px var(--body)}
details>summary{cursor:pointer;font-weight:600}
.area{border-radius:16px;padding:22px 24px} .ahead h3{font-size:20px}
.stageh{font-size:20px;margin-top:14px}
.report{border-radius:20px;padding:40px}
.toast{border-radius:999px;padding:12px 20px}
[hidden]{display:none!important}
</style>
</head>

function parseRepoUrl(input){
  let s = (input||"").trim();
  if(!s) return null;
  if(!/^https?:\/\//i.test(s)) s = "https://" + s;
  let u; try { u = new URL(s); } catch(e){ return null; }
  const host = u.hostname.toLowerCase();
  const parts = u.pathname.replace(/\.git$/,"").split("/").filter(Boolean);
  if(parts.length < 2) return null;
  let kind = "unknown";
  if(host === "github.com" || host === "www.github.com") kind = "github";
  else if(host === "gitlab.com" || host.includes("gitlab")) kind = "gitlab";
  else if(host === "codeberg.org" || host.includes("gitea") || host.includes("forgejo")) kind = "gitea";
  // GitLab supports nested groups: owner is everything before the last segment (stop at "/-/")
  let owner, repo;
  if(kind === "gitlab"){
    const idx = parts.indexOf("-");
    const p = idx > -1 ? parts.slice(0, idx) : parts;
    repo = p[p.length-1]; owner = p.slice(0,-1).join("/");
  } else { owner = parts[0]; repo = parts[1]; }
  return { kind, host, owner, repo, path: owner + "/" + repo, canonical: `https://${host}/${owner}/${repo}` };
}

function isoDaysAgo(d){ return new Date(Date.now() - d*864e5).toISOString().slice(0,10); }

async function getJSON(url, headers, errors, label){
  try {
    const r = await fetch(url, { headers: Object.assign({ "Accept": "application/json" }, headers||{}) });
    if(r.status === 404) return { notFound:true };
    if(r.status === 403 || r.status === 429){
      const rem = r.headers.get("x-ratelimit-remaining");
      const reset = r.headers.get("x-ratelimit-reset");
      let msg = `${label||url}: HTTP ${r.status}`;
      if(rem === "0" && reset){ msg += ` (rate limit reached; resets ${new Date(Number(reset)*1000).toLocaleTimeString()})`; }
      errors.push(msg); return null;
    }
    if(!r.ok){ errors.push(`${label||url}: HTTP ${r.status}`); return null; }
    const j = await r.json();
    j.__headers = { link: r.headers.get("link"), total: r.headers.get("x-total") || r.headers.get("x-total-count") };
    return j;
  } catch(e){ errors.push(`${label||url}: ${e.message || "network error"}`); return null; }
}

function lastPageFromLink(link){
  if(!link) return null; const m = /[?&]page=(\d+)>;\s*rel="last"/.exec(link); return m ? Number(m[1]) : null;
}

function classifyEntries(names, dirs){
  const lower = names.map(n=>n.toLowerCase());
  const has = (re) => names.find(n => re.test(n)) || null;
  const f = {
    readme: has(/^readme(\.|$)/i), license: has(/^(license|licence|copying|unlicense)(\.|$|-)/i), contributing: has(/^contributing(\.|$)/i),
    codeOfConduct: has(/^code[-_]?of[-_]?conduct(\.|$)/i), security: has(/^security(\.|$)/i), governance: has(/^governance(\.|$)/i),
    maintainers: has(/^(maintainers|authors|codeowners)(\.|$)/i), roadmap: has(/^roadmap(\.|$)/i), changelog: has(/^(changelog|changes|history|news|releases)(\.|$)/i),
    citation: has(/^citation(\.cff)?$/i), codemeta: has(/^codemeta\.json$/i), support: has(/^support(\.|$)/i), funding: has(/^funding(\.yml|\.yaml|\.md)?$/i),
    docsDir: dirs.find(d => /^(docs?|documentation|wiki|manual)$/i.test(d)) || null,
    testsDir: dirs.find(d => /^(tests?|spec|__tests__|testing)$/i.test(d)) || null,
    dependabot: null, renovate: has(/^(renovate\.json5?|\.renovaterc(\.json)?)$/i), ciFile: has(/^(\.gitlab-ci\.yml|\.travis\.yml|azure-pipelines\.yml|jenkinsfile|\.drone\.yml|\.woodpecker\.ya?ml|appveyor\.yml|\.circleci)$/i),
    manifests: names.filter(n => MANIFESTS.includes(n) || /\.csproj$/i.test(n)),
    hardware: names.filter(n => HW_EXT.some(e => n.toLowerCase().endsWith(e)) || /bom.*\.(csv|xlsx|ods|md)$/i.test(n)).concat(dirs.filter(d => HW_DIRS.includes(d.toLowerCase())).map(d => d + "/")),
    preCommit: has(/^\.pre-commit-config\.ya?ml$/i)
  };
  return f;
}

// ---------- GitHub ----------
async function fetchGitHub(ref, token){
  const errors = []; const H = token ? { "Authorization": "Bearer " + token, "X-GitHub-Api-Version":"2022-11-28" } : { "X-GitHub-Api-Version":"2022-11-28" };
  const base = `https://api.github.com/repos/${ref.owner}/${ref.repo}`;
  const d90 = isoDaysAgo(90), d180 = isoDaysAgo(180), d365 = isoDaysAgo(365);
  const [repo, community, releases, contributors, commits, closed180, opened180, merged180, root, dotgithub, workflows] = await Promise.all([
    getJSON(base, H, errors, "repository"),
    getJSON(base + "/community/profile", H, errors, "community profile"),
    getJSON(base + "/releases?per_page=10", H, errors, "releases"),
    getJSON(base + "/contributors?per_page=100&anon=1", H, errors, "contributors"),
    getJSON(base + `/commits?since=${d90}T00:00:00Z&per_page=100`, H, errors, "commits (90 days)"),
    getJSON(`https://api.github.com/search/issues?q=repo:${ref.owner}/${ref.repo}+is:issue+closed:>=${d180}&per_page=1`, H, errors, "closed issues (180 days)"),
    getJSON(`https://api.github.com/search/issues?q=repo:${ref.owner}/${ref.repo}+is:issue+created:>=${d180}&per_page=1`, H, errors, "opened issues (180 days)"),
    getJSON(`https://api.github.com/search/issues?q=repo:${ref.owner}/${ref.repo}+is:pr+merged:>=${d180}&per_page=1`, H, errors, "merged pull requests (180 days)"),
    getJSON(base + "/contents/", H, errors, "root listing"),
    getJSON(base + "/contents/.github", H, errors, ".github listing"),
    getJSON(base + "/contents/.github/workflows", H, errors, "workflows listing")
  ]);
  if(!repo || repo.notFound) return { ok:false, errors: errors.length ? errors : ["Repository not found or not public."] };
  let tags = null;
  if(Array.isArray(releases) && releases.length === 0){ tags = await getJSON(base + "/tags?per_page=5", H, errors, "tags"); }

  const rootNames = Array.isArray(root) ? root.map(e=>e.name) : [];
  const rootDirs = Array.isArray(root) ? root.filter(e=>e.type==="dir").map(e=>e.name) : [];
  const files = classifyEntries(rootNames, rootDirs);
  const gh = Array.isArray(dotgithub) ? dotgithub.map(e=>e.name) : [];
  const ghl = gh.map(n=>n.toLowerCase());
  files.security = files.security || (ghl.includes("security.md") ? ".github/SECURITY.md" : null);
  files.funding = files.funding || (ghl.includes("funding.yml") ? ".github/FUNDING.yml" : null);
  files.codeOfConduct = files.codeOfConduct || (gh.find(n=>/^code[-_]?of[-_]?conduct/i.test(n)) ? ".github/CODE_OF_CONDUCT.md" : null);
  files.contributing = files.contributing || (gh.find(n=>/^contributing/i.test(n)) ? ".github/CONTRIBUTING.md" : null);
  files.maintainers = files.maintainers || (ghl.includes("codeowners") ? ".github/CODEOWNERS" : null) || (rootNames.includes("docs") ? null : null);
  files.dependabot = ghl.includes("dependabot.yml") || ghl.includes("dependabot.yaml") ? ".github/dependabot.yml" : null;
  files.issueTemplate = gh.find(n=>/^issue_template/i.test(n)) ? ".github/ISSUE_TEMPLATE" : null;
  files.prTemplate = gh.find(n=>/^pull_request_template/i.test(n)) ? ".github/PULL_REQUEST_TEMPLATE" : null;
  files.workflows = Array.isArray(workflows) ? workflows.filter(e=>/\.ya?ml$/i.test(e.name)).map(e=>e.name) : [];
  files.security = files.security || (community && community.files && community.files.security_policy ? "SECURITY (community profile)" : null);

  // Community profile (GitHub's own evidence of community files)
  const cp = community && !community.notFound ? community : null;
  const cpf = cp && cp.files ? cp.files : {};
  if(cpf.contributing && !files.contributing) files.contributing = "CONTRIBUTING (community profile)";
  if(cpf.code_of_conduct && !files.codeOfConduct) files.codeOfConduct = "CODE_OF_CONDUCT (community profile)";
  if(cpf.readme && !files.readme) files.readme = "README (community profile)";
  if(cpf.license && !files.license) files.license = "LICENSE (community profile)";
  if(cpf.issue_template && !files.issueTemplate) files.issueTemplate = "issue template (community profile)";
  if(cpf.pull_request_template && !files.prTemplate) files.prTemplate = "pull request template (community profile)";

  // People
  const cl = Array.isArray(contributors) ? contributors : [];
  const total = cl.reduce((a,c)=>a+(c.contributions||0),0);
  const sorted = cl.slice().sort((a,b)=>(b.contributions||0)-(a.contributions||0));
  const lastPage = contributors && contributors.__headers ? lastPageFromLink(contributors.__headers.link) : null;
  const people = {
    contributorsCount: Array.isArray(contributors) ? cl.length : null, contributorsCapped: cl.length >= 100, contributorsPages: lastPage,
    topShare: total ? (sorted[0].contributions||0)/total : null,
    top3Share: total ? sorted.slice(0,3).reduce((a,c)=>a+(c.contributions||0),0)/total : null,
    recentAuthors: Array.isArray(commits) ? new Set(commits.map(c => (c.author && c.author.login) || (c.commit && c.commit.author && c.commit.author.email) || "?")).size : null
  };

  const rel = Array.isArray(releases) ? releases : [];
  const activity = {
    commits90d: Array.isArray(commits) ? commits.length : null, commits90dCapped: Array.isArray(commits) && commits.length >= 100,
    releasesCount: rel.length, releasesCapped: rel.length >= 10,
    latestRelease: rel[0] ? { tag: rel[0].tag_name, name: rel[0].name, date: rel[0].published_at, url: rel[0].html_url, prerelease: rel[0].prerelease } : null,
    latestTag: Array.isArray(tags) && tags[0] ? tags[0].name : null,
    releasesLastYear: rel.filter(r => r.published_at && r.published_at.slice(0,10) >= d365).length
  };
  const issues = {
    open: repo.open_issues_count, closed180d: closed180 && typeof closed180.total_count === "number" ? closed180.total_count : null,
    opened180d: opened180 && typeof opened180.total_count === "number" ? opened180.total_count : null,
    merged180d: merged180 && typeof merged180.total_count === "number" ? merged180.total_count : null
  };
  const licenseFile = await getJSON(base + "/license", H, errors, "license file");
  const sbomResult = await getJSON(base + "/dependency-graph/sbom", H, errors, "dependency graph");
  const lic = repo.license && repo.license.spdx_id && repo.license.spdx_id !== "NOASSERTION" ? repo.license.spdx_id : (repo.license ? "unrecognized" : null);
  const signals = {
    ok:true, source:"GitHub", host:"github.com", owner:ref.owner, repo:ref.repo, url: repo.html_url, fetchedAt: new Date().toISOString(),
    meta: { description: repo.description, homepage: repo.homepage, archived: !!repo.archived, disabled: !!repo.disabled, fork: !!repo.fork, createdAt: repo.created_at, pushedAt: repo.pushed_at, defaultBranch: repo.default_branch, stars: repo.stargazers_count, forks: repo.forks_count, watchers: repo.subscribers_count, topics: repo.topics||[], hasIssues: repo.has_issues, hasDiscussions: !!repo.has_discussions, hasWiki: repo.has_wiki, visibility: repo.visibility, language: repo.language },
    license: { spdx: lic, name: repo.license ? repo.license.name : null, url: licenseFile && licenseFile.html_url || (Array.isArray(root) && root.find(e => /^(license|licence|copying)(\.|$)/i.test(e.name)) || {}).html_url || null, osi: lic ? OSI_SPDX.has(lic) : null, hardware: lic ? HW_SPDX.has(lic) : null },
    community: cp ? { health: cp.health_percentage, description: cp.description, documentation: cp.documentation } : null,
    dependencies: normalizeDependencies(sbomResult, repo.html_url),
    files, people, activity, issues, scorecard: null, errors
  };
  signals.scorecard = await fetchScorecard("github.com", ref.owner, ref.repo, errors);
  return signals;
}

// ---------- OpenSSF Scorecard (public API, GitHub + GitLab projects) ----------
async function fetchScorecard(platform, owner, repo, errors){
  const j = await getJSON(`https://api.securityscorecards.dev/projects/${platform}/${owner}/${repo}`, {}, errors, "OpenSSF Scorecard");
  if(!j || j.notFound || !Array.isArray(j.checks)) return null;
  const checks = {}; j.checks.forEach(c => { checks[c.name] = { score: c.score, reason: c.reason, url: c.documentation && c.documentation.url }; });
  return { score: j.score, date: j.date, version: j.scorecard && j.scorecard.version, commit: j.repo && j.repo.commit, checks, url: `https://scorecard.dev/viewer/?uri=${platform}/${owner}/${repo}` };
}

  const signals = {

    meta: { description: proj.description, homepage: null, archived: !!proj.archived, fork: !!proj.forked_from_project, createdAt: proj.created_at, pushedAt: proj.last_activity_at, defaultBranch: proj.default_branch, stars: proj.star_count, forks: proj.forks_count, topics: proj.topics||[], hasIssues: proj.issues_enabled !== false, hasWiki: proj.wiki_enabled, visibility: proj.visibility },
    license: { spdx, name: licKey, url: proj.license_url || null, osi: spdx ? OSI_SPDX.has(spdx) : null, hardware: spdx ? HW_SPDX.has(spdx) : null },
    community: null,
    files, people: { contributorsCount: cl.length, contributorsCapped: cl.length >= 100, topShare: total ? (sorted[0].commits||0)/total : null, top3Share: total ? sorted.slice(0,3).reduce((a,c)=>a+(c.commits||0),0)/total : null, recentAuthors: Array.isArray(commits) ? new Set(commits.map(c=>c.author_email||c.author_name)).size : null },
    activity: { commits90d: Array.isArray(commits) ? commits.length : null, commits90dCapped: Array.isArray(commits) && commits.length >= 100, releasesCount: rel.length, releasesCapped: rel.length >= 10, latestRelease: rel[0] ? { tag: rel[0].tag_name, name: rel[0].name, date: rel[0].released_at, url: rel[0]._links && rel[0]._links.self } : null, latestTag: null, releasesLastYear: rel.filter(r=>r.released_at && r.released_at.slice(0,10) >= d365).length },
    issues: { open: proj.open_issues_count, opened180d: statsOpened && statsOpened.statistics ? statsOpened.statistics.counts.all : null, closed180d: statsClosed && statsClosed.statistics ? statsClosed.statistics.counts.closed : null, merged180d: Array.isArray(mrs) ? mrs.length : null },

async function fetchGitea(ref, token){
  const errors = []; const H = token ? { "Authorization": "token " + token } : {};
  const api = `https://${ref.host}/api/v1/repos/${ref.owner}/${ref.repo}`;
  const d90 = isoDaysAgo(90), d180 = isoDaysAgo(180), d365 = isoDaysAgo(365);
  const [repo, root, releases, commits, closed, dotgithub, dotforgejo] = await Promise.all([
    getJSON(api, H, errors, "repository"),
    getJSON(api + "/contents/", H, errors, "root listing"),
    getJSON(api + "/releases?limit=10", H, errors, "releases"),
    getJSON(api + `/commits?since=${d90}T00:00:00Z&limit=100&stat=false`, H, errors, "commits (90 days)"),
    getJSON(api + `/issues?state=closed&type=issues&since=${d180}T00:00:00Z&limit=50`, H, errors, "closed issues (180 days)"),
    getJSON(api + "/contents/.github/workflows", H, errors, ".github/workflows"),
    getJSON(api + "/contents/.forgejo/workflows", H, errors, ".forgejo/workflows")
  ]);
  if(!repo || repo.notFound) return { ok:false, errors: errors.length ? errors : ["Repository not found or not public."] };
  const names = Array.isArray(root) ? root.map(e=>e.name) : []; const dirs = Array.isArray(root) ? root.filter(e=>e.type==="dir").map(e=>e.name) : [];
  const files = classifyEntries(names, dirs);
  files.workflows = [].concat(Array.isArray(dotgithub)?dotgithub.map(e=>e.name):[], Array.isArray(dotforgejo)?dotforgejo.map(e=>e.name):[]).concat(files.ciFile?[files.ciFile]:[]);
  const rel = Array.isArray(releases) ? releases : [];
  const spdx = Array.isArray(repo.licenses) && repo.licenses[0] ? repo.licenses[0] : (files.license ? "unrecognized" : null);
  return {
    ok:true, source:"Gitea/Forgejo", host: ref.host, owner: ref.owner, repo: ref.repo, url: repo.html_url, fetchedAt: new Date().toISOString(),
    meta: { description: repo.description, homepage: repo.website, archived: !!repo.archived, fork: !!repo.fork, createdAt: repo.created_at, pushedAt: repo.updated_at, defaultBranch: repo.default_branch, stars: repo.stars_count, forks: repo.forks_count, topics: [], hasIssues: repo.has_issues, hasWiki: repo.has_wiki },
    license: { spdx, name: spdx, url: null, osi: spdx ? OSI_SPDX.has(spdx) : null, hardware: spdx ? HW_SPDX.has(spdx) : null },
    community: null, files,
    people: { contributorsCount: null, topShare: null, top3Share: null, recentAuthors: Array.isArray(commits) ? new Set(commits.map(c=>(c.author&&c.author.login)||(c.commit&&c.commit.author&&c.commit.author.email))).size : null },
    activity: { commits90d: Array.isArray(commits) ? commits.length : null, commits90dCapped: Array.isArray(commits) && commits.length >= 100, releasesCount: rel.length, releasesCapped: rel.length >= 10, latestRelease: rel[0] ? { tag: rel[0].tag_name, name: rel[0].name, date: rel[0].published_at, url: rel[0].html_url } : null, latestTag: null, releasesLastYear: rel.filter(r=>r.published_at && r.published_at.slice(0,10) >= d365).length },
    issues: { open: repo.open_issues_count, closed180d: Array.isArray(closed) ? closed.length : null, opened180d: null, merged180d: null },

  };
}

async function fetchRepositoryEvidence(ref, token){

// ---------- Route: light review vs extended review ----------
// Mirrors the portal's rule: start light; expand only when a trigger fires.
function computeRoute(c, S, answers){
  const t = [];
  const a = (q) => answers && answers[q] ? answers[q].verdict : null;
  if(c.activity === "commissioned") t.push({ kind:"clarify", text:"Commissioned development: clarify scope before setting the route." });
  if(c.sensitiveData) t.push({ kind:"trigger", text:"The software or hardware handles sensitive or personal data.", refer:"privacy / data protection" });
  if(c.externalService) t.push({ kind:"trigger", text:"An external shared service or provider will host or access institutional systems.", refer:"information security" });
  if(c.materialDependency) t.push({ kind:"trigger", text:"The project is a material dependency for the research or unit." });
  if(c.clinical) t.push({ kind:"trigger", text:"Clinical or physical-safety relevance declared.", refer:"specialist safety / clinical review" });
  else if(c.clinicalUnknown) t.push({ kind:"follow-up", text:"Clinical or safety relevance not yet known; confirm before the decision." });
  if(c.kind !== "software" || c.hardwareWork) t.push({ kind:"trigger", text:"Physical hardware: fabrication, acceptance and safety questions apply." });
  if(S && S.ok){
    if(!S.license.spdx) t.push({ kind:"baseline", text:"No license detected in the repository." });
    else if(S.license.spdx === "unrecognized") t.push({ kind:"baseline", text:"License file present but not recognised; legal reading needed.", refer:"legal" });
    else if(!S.license.osi && !S.license.hardware) t.push({ kind:"baseline", text:`License ${S.license.spdx} is not on the OSI-approved list used here.`, refer:"legal" });
    if(S.meta.archived) t.push({ kind:"baseline", text:"Upstream repository is archived." });
    const d = daysSince(S.meta.pushedAt); if(d != null && d > 365) t.push({ kind:"baseline", text:`No activity for ${d} days.` });
    if(!S.files.security) t.push({ kind:"baseline", text:"No vulnerability disclosure policy found." });
    const v = S.scorecard && S.scorecard.checks && S.scorecard.checks["Vulnerabilities"]; if(v && v.score != null && v.score >= 0 && v.score < 7) t.push({ kind:"baseline", text:`Scorecard reports known vulnerabilities (${v.score}/10).` });
    if(S.people.topShare != null && S.people.topShare > 0.8 && (S.people.contributorsCount||0) < 10) t.push({ kind:"baseline", text:"Contribution history concentrated in one person." });
  }
  ["Q03","Q25","Q28","Q51"].forEach(q => { if(a(q) === "no") t.push({ kind:"assessor", text:`${q} marked “not satisfied” by the assessor.` }); });
  const route = t.some(x=>x.kind==="clarify") ? "clarify" : t.some(x=>x.kind!=="follow-up") ? "extended" : "light";
  return { route, triggers: t };
}

const DATA_OPTS = [["public","Public / non-sensitive"],["internal","Internal / confidential"],["personal","Personal or sensitive"],["regulated","Regulated (health, student records, export-controlled)"]];

function formToContext(f){

    kind: f.type === "both" ? "both" : f.type === "hardware" ? "hardware" : "software",

// Gaps the reviewer can flag upstream, derived from the repository signals. Each gap says what is missing,
// why it matters to an institutional buyer, and what would close it. The reviewer picks which to send and edits the text.
function detectGaps(S){
  if(!S || !S.ok) return [];
  const F = S.files, L = S.license, P = S.people, A = S.activity, sc = S.scorecard; const g = [];
  const check = (n) => sc && sc.checks && sc.checks[n];
  const low = (n, t) => { const c = check(n); return c && c.score != null && c.score >= 0 && c.score < t; };
  if(!L.spdx) g.push({ id:"license", title:"No license detected", why:"Without a recognised license the institution cannot establish what it may use, modify or distribute.", ask:"Add a LICENSE file with an OSI-approved (or, for hardware, CERN-OHL/TAPR) license and state it in the README." });
  else if(L.spdx === "unrecognized") g.push({ id:"license", title:"License file not machine-recognisable", why:"Automated checks and institutional reviewers cannot identify the terms without reading the file.", ask:"Use the standard text of the license and name its SPDX identifier in the README and package metadata." });
  if(!F.security) g.push({ id:"security", title:"No security policy", why:"Institutional security review expects a documented way to report vulnerabilities and an indication of response times.", ask:"Add a SECURITY.md with a contact (or a private reporting route) and what reporters can expect." });
  if(!F.governance && !F.maintainers) g.push({ id:"governance", title:"No governance or maintainers document", why:"Buyers need to know who can make decisions and who to contact about support arrangements.", ask:"Add a GOVERNANCE.md or MAINTAINERS file naming the decision-makers and how decisions are made." });
  if(!F.funding && !F.support) g.push({ id:"support-route", title:"No stated way to fund or buy support", why:"Institutions can rarely pay an individual; they need a signable counterparty (a fiscal host, foundation or company) and a description of what support is available.", ask:"Add a SUPPORT.md or FUNDING.yml describing how an organisation can fund the project or purchase support, naming the entity that can sign." });
  else if(!F.support) g.push({ id:"support-options", title:"Support options not documented", why:"Procurement needs to know what support exists and where its boundaries are before it can contract for it.", ask:"Add a SUPPORT.md listing the available support routes (community, paid, hosting) and who provides them." });
  if(!F.contributing) g.push({ id:"contributing", title:"No contribution guide", why:"Buyers who fund modifications need to know whether and how changes can be submitted upstream.", ask:"Add a CONTRIBUTING.md covering how changes are proposed, reviewed and accepted, and any contributor agreement." });
  if(!F.codeOfConduct) g.push({ id:"conduct", title:"No code of conduct", why:"Institutions check that community spaces their staff will join have a conduct policy and a response process.", ask:"Add a CODE_OF_CONDUCT.md with a named contact." });
  if(!F.readme) g.push({ id:"readme", title:"No README", why:"Reviewers cannot establish what the project is or how to install it.", ask:"Add a README with purpose, installation and where documentation lives." });
  if(!F.citation && !F.codemeta) g.push({ id:"citation", title:"No citation metadata", why:"Academic users need a stable way to cite the project, and reviewers use it as evidence of adoption.", ask:"Add a CITATION.cff (and optionally codemeta.json)." });
  if(!A.latestRelease && !A.latestTag) g.push({ id:"releases", title:"No tagged releases", why:"Procurement contracts reference versions; without releases there is nothing to pin or to assess.", ask:"Publish tagged, versioned releases with notes." });
  if(!F.changelog && (A.latestRelease || A.latestTag)) g.push({ id:"changelog", title:"No changelog", why:"Reviewers and operators need to see what changed between the version assessed and the version deployed.", ask:"Keep a CHANGELOG or release notes per release." });
  if(!F.workflows || !F.workflows.length) g.push({ id:"ci", title:"No continuous integration found", why:"Security and operations reviews look for automated testing as evidence that releases are checked.", ask:"Add a CI workflow that runs the test suite on each change." });
  if(!F.dependabot && !F.renovate && !(check("Dependency-Update-Tool") && !low("Dependency-Update-Tool", 7))) g.push({ id:"dep-updates", title:"No automated dependency updates", why:"Stale dependencies are the most common source of known vulnerabilities in deployed software.", ask:"Enable Dependabot or Renovate." });
  if(low("Signed-Releases", 7) || (check("Signed-Releases") && check("Signed-Releases").score < 0 && (A.latestRelease))) g.push({ id:"signed", title:"Releases are not signed or attested", why:"Institutions increasingly require verifiable release integrity (provenance or signatures) before deployment.", ask:"Sign release artifacts or publish build provenance (for example SLSA attestations or Sigstore)." });
  if(low("Branch-Protection", 5)) g.push({ id:"branch", title:"Weak branch protection", why:"Reviewers read unprotected release branches as a supply-chain risk.", ask:"Require reviews and status checks on the default and release branches." });
  if(low("Pinned-Dependencies", 5)) g.push({ id:"pinning", title:"Build dependencies not pinned", why:"Unpinned build dependencies make releases hard to reproduce and to audit.", ask:"Pin dependencies in CI and build files by version or hash." });
  if(low("Vulnerabilities", 7)) g.push({ id:"vulns", title:"Known vulnerabilities reported", why:"Open vulnerabilities in dependencies block most institutional security sign-offs.", ask:"Update or replace the affected dependencies and note the fix in release notes." });
  if(P.topShare != null && P.topShare > 0.8 && (P.contributorsCount||0) < 10) g.push({ id:"succession", title:"Single-maintainer concentration", why:"Buyers assess continuity; a project that depends on one person needs a stated plan for what happens if they step back.", ask:"Document maintainer succession or add co-maintainers with release rights." });
  if(!F.roadmap) g.push({ id:"roadmap", title:"No roadmap", why:"Institutions planning multi-year use want to see where the project is heading and what is out of scope.", ask:"Publish a short roadmap (a ROADMAP.md or a pinned issue)." });

  return g;
}

function upstreamIssueText(c, gaps){

  const L = [];

  gaps.forEach((g, i) => { L.push(`${i+1}. ${g.title}`, `   Why it matters: ${g.why}`, `   What would help: ${g.ask}`, ""); });

function routeBanner(R){

// At-a-glance tiles: status with a word beside each dot, never color alone
function glanceTiles(S){
  const L = S.license, A = S.activity, P = S.people, F = S.files, sc = S.scorecard, dPush = daysSince(S.meta.pushedAt);
  const t = [];
  t.push(L.spdx && L.spdx !== "unrecognized" ? { label:"License", value: L.spdx, state: (L.osi||L.hardware) ? "ok" : "warn", word: L.osi ? "OSI-approved" : L.hardware ? "Open hardware" : "Check terms" } : L.spdx === "unrecognized" ? { label:"License", value:"Unrecognised", state:"warn", word:"Read the file" } : { label:"License", value:"None found", state:"bad", word:"Missing" });
  const actState = S.meta.archived ? "bad" : dPush == null ? "none" : dPush <= 180 ? "ok" : dPush <= 365 ? "warn" : "bad";
  t.push({ label:"Activity", value: S.meta.archived ? "Archived" : dPush == null ? "—" : dPush <= 30 ? "Active this month" : `Last push ${dPush} d ago`, state: actState, word: S.meta.archived ? "Read-only upstream" : actState === "ok" ? "Maintained" : actState === "warn" ? "Slowing" : "Stale", sub: A.latestRelease ? `Release ${A.latestRelease.tag||""} · ${fmtDate(A.latestRelease.date)}` : A.latestTag ? `Tag ${A.latestTag}, no releases` : "No releases" });
  if(P.contributorsCount != null){ const st = P.topShare == null ? "none" : P.topShare > 0.8 ? "bad" : P.topShare > 0.5 ? "warn" : "ok"; t.push({ label:"Maintainers", value: `${P.contributorsCount}${P.contributorsCapped?"+":""} contributors`, state: st, word: st === "ok" ? "Shared load" : st === "warn" ? "Concentrated" : st === "bad" ? "One person" : "—", sub: P.topShare != null ? `Top contributor ${pct(P.topShare)} · ${P.recentAuthors ?? "—"} active in 90 d` : "" }); }
  else t.push({ label:"Maintainers", value: `${P.recentAuthors ?? "—"} active authors`, state: P.recentAuthors >= 3 ? "ok" : P.recentAuthors >= 1 ? "warn" : "none", word: P.recentAuthors >= 3 ? "Several" : P.recentAuthors >= 1 ? "Few" : "Unknown", sub:"last 90 days" });
  const vuln = sc && sc.checks && sc.checks["Vulnerabilities"]; const vulnBad = vuln && vuln.score != null && vuln.score >= 0 && vuln.score < 7;
  t.push({ label:"Security", value: F.security ? "Policy present" : "No policy", state: vulnBad ? "bad" : F.security ? "ok" : "warn", word: vulnBad ? "Known vulnerabilities" : F.security ? "Disclosure route" : "No disclosure route", sub: (F.workflows && F.workflows.length ? `CI: ${F.workflows.length} workflow${F.workflows.length===1?"":"s"}` : "No CI found") + (vuln && !vulnBad && vuln.score >= 0 ? " · no known vulns" : "") });
  const docs = [F.readme, F.contributing, F.codeOfConduct, F.docsDir].filter(Boolean).length;
  t.push({ label:"Documentation", value: `${docs} of 4 basics`, state: docs >= 3 ? "ok" : docs >= 1 ? "warn" : "bad", word: docs >= 3 ? "Present" : docs >= 1 ? "Partial" : "Missing", sub: ["README","CONTRIBUTING","Code of conduct","docs/"].filter((_,i) => ![F.readme, F.contributing, F.codeOfConduct, F.docsDir][i]).map(x => "no " + x).join(", ") || "README, CONTRIBUTING, conduct, docs/" });
  if(sc) t.push({ label:"OpenSSF Scorecard", value: sc.score != null ? sc.score.toFixed(1) + " / 10" : "—", state: sc.score == null ? "none" : sc.score >= 7 ? "ok" : sc.score >= 4 ? "warn" : "bad", word: sc.score == null ? "—" : sc.score >= 7 ? "Good" : sc.score >= 4 ? "Mixed" : "Low", sub: Object.entries(sc.checks).filter(([k,v]) => v.score != null && v.score >= 0 && v.score < 4).map(([k]) => k).slice(0,3).join(", ") || "no low checks" });
  else t.push({ label:"OpenSSF Scorecard", value:"No result", state:"none", word:"Not scored", sub:"Only github.com and gitlab.com projects are scored" });
  return t;
}

function renderUpstream(c, inForm){

function tenAnswer(c, t){

  if(S.ok){

function slug(s){ return String(s||"assessment").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "assessment"; }
async function download(name, text, type){

function caseMarkdown(c){
  const S = c.signals; const E = c.evidence || {}; const R = computeRoute(ctxOf(c), S, {}); const own = c.ownership || {};
  const L = [];
  L.push(`# ${caseTitle(c)}`, "", `FIN open source procurement toolkit — assessment record`, "", `- Candidate: ${tenAnswer(c, TEN[2])}`, `- Contact: ${c.form.contact || "—"}`, `- Date: ${fmtDate(c.updatedAt || c.createdAt)}`, "");
  L.push(`## Route and decision`, "", `Route: **${R.route === "light" ? "Light review" : R.route === "extended" ? "Extended review" : "Clarify scope"}**`, "");
  R.triggers.forEach(t => L.push(`- ${t.text}${t.refer ? " (refer: " + t.refer + ")" : ""}`)); if(!R.triggers.length) L.push("- No extended-review triggers.");
  L.push("", `Decision: ${DECISION[own.decision||"open"]}`, `Decision owner: ${own.owner||"—"}`, `Operational owner: ${own.operator||"—"}`, `Conditions: ${own.conditions||"—"}`, `Review: ${own.reviewDate||"—"}${own.reviewTrigger ? " · " + own.reviewTrigger : ""}`, "");
  L.push(`## Request and supporting information`, ""); TEN.filter(t => t.n !== 4).forEach(t => { L.push(`**${String(t.n > 4 ? t.n-1 : t.n).padStart(2,"0")} ${t.q}**`, "", tenAnswer(c,t) + (t.auto && c.form.drafts && c.form.drafts[t.key] && c.form[t.key] === c.form.drafts[t.key] ? " _(drafted from repository signals, unedited)_" : ""), ""); });
  if(S && S.ok){ L.push(`Evidence labels: Information retrieved means source information, not verified suitability. Needs review means illustrative, incomplete or uncertain. No information available does not establish absence. Not a repository question means the answer depends on the request and the institution.`, ""); L.push(`## Dependency evidence`, "", dependencyText(S), ""); L.push(`## Repository evidence snapshot`, "", `Fetched ${fmtDate(S.fetchedAt)} from ${S.source}.${S.scorecard ? ` OpenSSF Scorecard ${S.scorecard.score != null ? S.scorecard.score.toFixed(1) : "—"}/10 (${fmtDate(S.scorecard.date)}).` : ""}`, ""); evidenceSnapshotRows(S).forEach(([k,v]) => L.push(`- ${k}: ${v}`)); if(S.errors.length) L.push(`- Not retrieved: ${S.errors.join("; ")}`); L.push(""); }
  L.push(`## Institutional review`, "", `| Area | Mark | Notes and signals |`, `|---|---|---|`);
  activeAreas(c).forEach(a => { const ans = c.answers[a.id]||{}; const sp = areaSpecialist(a, c); const sum = areaSignalSummary(a, c); L.push(`| ${a.name}${sp ? " (→ " + sp + ")" : ""} | ${ans.verdict ? AREA_VLABEL[ans.verdict] : "open"} | ${[evidenceLabel(areaEvidence(a,c),S,areaRepoInformed(a)), ans.note, sum ? `${sum.count} signals: ${sum.ok} positive${sum.mixed ? ", " + sum.mixed + " to check" : ""}${sum.bad ? ", " + sum.bad + " missing or negative" : ""}` : ""].filter(Boolean).join(" — ").replace(/\|/g,"\\|").replace(/\n/g," ")} |`); });
  if(inactiveAreas(c).length) L.push("", `Not triggered: ${inactiveAreas(c).map(a => a.name).join(", ")}.`);

  if(S && S.ok && c.upstream && c.upstream.selected && c.upstream.selected.length){ L.push(`## Feedback to the project${c.upstream.sent ? " (sent)" : " (drafted)"}`, ""); detectGaps(S).filter(g => c.upstream.selected.includes(g.id)).forEach(g => L.push(`- **${g.title}.** ${g.ask}`)); L.push(""); }
  L.push(`---`, `Question set aligned across HEOSAT, CHAOSS, OpenSSF, OSOR, IDB, HECVAT, OpenChain, OSBA and open hardware sources. Crosswalk: ${CROSSWALK_URL}`);
  return L.join("\n");
}

// Evidence helpers: facts are separate from institutional decisions.
function licenseClass(id){
  if(!id || id === "NOASSERTION" || id === "unrecognized") return "Unidentified: custom, modified or undetected terms; reviewer must inspect";
  if(/\s(?:AND|OR|WITH)\s|[()]/.test(id)) return "Multiple licenses / exception: reviewer must inspect the expression";
  if(/^LicenseRef-/.test(id)) return "Custom / non-standard identifier: read the supplied terms";
  if(/^(AGPL)-/.test(id)) return "Network copyleft";
  if(/^(GPL|EUPL|CECILL)-/.test(id) || id === "CERN-OHL-S-2.0") return "Strong copyleft / reciprocal";
  if(/^(LGPL|MPL|EPL|CDDL|MS-RL)-/.test(id) || id === "CERN-OHL-W-2.0") return "Limited copyleft / reciprocal";
  if(["MIT","Apache-2.0","BSD-2-Clause","BSD-3-Clause","ISC","0BSD","Zlib","BSL-1.0","Unlicense","CC0-1.0","UPL-1.0","NCSA","PostgreSQL","CERN-OHL-P-2.0"].includes(id)) return "Permissive / no copyleft";
  return "Not classified by this tool; not necessarily custom";
}
function autoPanel(c,key){
  const txt = c.signals && c.signals.ok ? (c.form[key] || draftAnswers(c.signals)[key]) : "Repository evidence unavailable. Add a repository URL and select Read repository. The reviewer follows up on missing evidence.";
  return `<div class="banner info"><b>${evidenceLabel(((TEN.find(t=>t.key===key)||{}).xw||[]).flatMap(id => (c.evidence && c.evidence[id] && c.evidence[id].items || []).filter(i=>i.src!=="toolkit")),c.signals)}</b><p class="hint">${c.signals?.example?"Illustrative example; not retrieved live.":c.signals?.ok?"Retrieved " + h(fmtDate(c.signals.fetchedAt)) + " from " + h(c.signals.source):"You can continue without a repository."}</p><p>${h(txt)}</p></div>`;
}
function licensePanel(S){
  const L = S && S.ok && S.license || {};
  return `<p><b>${h(L.spdx || "License not identified")}</b> · ${h(licenseClass(L.spdx))}${L.url ? ` · <a href="${h(L.url)}" target="_blank" rel="noopener">Read license text</a>` : ""}</p><details><summary>Plain-language guide to license terms</summary><p>Permissions: what may be used, changed or shared. Conditions: notices, source disclosure or reciprocal licensing that may apply. Limitations: warranty, liability, patent and trademark provisions to inspect.</p><p>Copyleft is a type of obligation, not an automatic reason to reject a project. A machine-unrecognized license is not proof of custom terms. Review the actual text and intended use, including dependency licenses and any separate service contract.</p><a href="https://choosealicense.com/appendix/" target="_blank" rel="noopener">License permissions, conditions and limitations reference</a></details>`;
}
function normalizeDependencies(result,url){
  const b = result && result.sbom;
  if(!b || !Array.isArray(b.packages)) return {status:"unavailable", source:url+"/network/dependencies", packages:[], edges:[]};
  return {status:"retrieved",source:url+"/network/dependencies",created:b.creationInfo && b.creationInfo.created,
    packages:b.packages.map(p=>({id:p.SPDXID,name:p.name,version:p.versionInfo||"",license:p.licenseConcluded && p.licenseConcluded!=="NOASSERTION" ? p.licenseConcluded : p.licenseDeclared||"NOASSERTION"})),
    edges:(b.relationships||[]).filter(r=>["DEPENDS_ON","DEPENDENCY_OF"].includes(r.relationshipType)).map(r=>r.relationshipType==="DEPENDS_ON"?{from:r.spdxElementId,to:r.relatedSpdxElement}:{from:r.relatedSpdxElement,to:r.spdxElementId})};
}
function dependencyText(S){
  const d=S.dependencies;
  if(!d || d.status!=="retrieved") return "Dependency graph unavailable; no conclusion about dependency absence or license compatibility.";
  return `GitHub SBOM: ${d.packages.length} packages, ${d.edges.length} reported relationships. Snapshot: ${d.created||"not supplied"}. Source: ${d.source}\n`+d.packages.map(p=>`${p.name} ${p.version}: used by ${dependentCount(d,p.id)} components; critical: ${d.review?.[p.id]?.critical||"Not assessed"}; role/impact: ${d.review?.[p.id]?.note||"Not recorded"}; license: ${p.license} (${licenseClass(p.license)})`).join("\n")+`\nOther critical software/services: ${d.context||"Not recorded"}`;
}
function dependencyLink(S){
  const d = S && S.dependencies; const n = d && d.status === "retrieved" ? d.packages.length : null;
  return `<p><a class="btn small" href="#dependencies">Open dependency analysis${n != null ? ` (${n} packages)` : ""}</a></p>`;
}
function viewDependencies(c){
  return `<div class="formv"><div class="row"><a class="btn" href="#form">← Request form</a><a class="btn" href="#review">← Staff review</a></div>${dependencyPanel(c.signals)}</div>`;
}
function dependencyPanel(S){
  const d=S && S.dependencies;
  if(!d || d.status!=="retrieved") return `<section class="card"><h3>Dependency graph</h3><p>Dependency data ${S && S.example ? "is not part of this illustrative snapshot" + (S.fictional ? "" : ". Read the repository live") : "could not be retrieved"}. This does not mean there are no dependencies.</p>${d ? `<a href="${h(d.source)}" target="_blank" rel="noopener">Inspect GitHub dependency evidence</a>` : ""}<p class="hint">GitHub only. Access permissions, rate limits or disabled dependency analysis can prevent retrieval.</p></section>`;
  const nodes=d.packages, lookup=new Map(nodes.map(p=>[p.id,p]));
  const choices=nodes.filter(p=>d.edges.some(e=>e.from===p.id));
  const root=choices.find(p=>p.id==="SPDXRef-Repository") || choices[0];
  return `<section class="card"><h3>Dependency graph</h3><p class="hint">GitHub SBOM · ${h(d.created||"date not supplied")} · ${nodes.length} packages · ${d.edges.length} reported edges. Select a component to see which software it relies on. Dependent counts show structural importance; your team identifies what is critical to the intended use. Coverage depends on GitHub analysis and may omit services, plugins or system software.</p><label class="field">Component<select id="depRoot">${choices.map(p=>`<option value="${h(p.id)}" ${p===root?"selected":""}>${h(p.name)}</option>`).join("")}</select></label><div id="depGraph">${graphFor(d,root && root.id)}</div><details open><summary>Software components, criticality and licenses</summary><div style="overflow:auto"><table><thead><tr><th>Component</th><th>Version</th><th>Used by</th><th>Critical for this use?</th><th>Role / failure impact</th><th>License</th><th>Classification</th></tr></thead><tbody>${nodes.map(p=>`<tr><td>${h(p.name)}</td><td>${h(p.version)}</td><td>${dependentCount(d,p.id)} components</td><td><select aria-label="Criticality of ${h(p.name)}" data-dep-critical="${h(p.id)}">${[["","Not assessed"],["yes","Yes"],["no","No"]].map(([v,l])=>`<option value="${v}" ${(d.review?.[p.id]?.critical||"")===v?"selected":""}>${l}</option>`).join("")}</select></td><td><input aria-label="Role and failure impact of ${h(p.name)}" data-dep-note="${h(p.id)}" value="${h(d.review?.[p.id]?.note||"")}" placeholder="e.g. database; analysis stops without it"></td><td>${/^[A-Za-z0-9.-]+$/.test(p.license)&&p.license!=="NOASSERTION"&&!p.license.startsWith("LicenseRef-")?`<a href="https://spdx.org/licenses/${encodeURIComponent(p.license)}.html" target="_blank" rel="noopener">${h(p.license)}</a>`:h(p.license)}</td><td>${h(licenseClass(p.license))}</td></tr>`).join("")}</tbody></table></div></details><label class="field">Other critical software or services missing from this graph<textarea data-dep-context placeholder="Name, role, version if known, and what happens if unavailable">${h(d.context||"")}</textarea><span class="hint">For example: database server, operating system, external API, hardware driver or manually installed plugin. These notes do not create inferred SBOM edges.</span></label><a href="${h(d.source)}" target="_blank" rel="noopener">Source on GitHub</a></section>`;
}
function dependentCount(d,id){
  const found=new Set(), queue=[id];
  while(queue.length){const current=queue.shift();for(const edge of d.edges){if(edge.to===current && edge.from!==id && !found.has(edge.from)){found.add(edge.from);queue.push(edge.from);}}}
  return found.size;
}
function saveDependencyInput(e){
  const t=e.target, d=CASE && CASE.signals && CASE.signals.dependencies;if(!d)return;
  const id=t.dataset.depCritical || t.dataset.depNote;
  if(id){d.review=d.review||{};d.review[id]=d.review[id]||{};if(t.dataset.depCritical!==undefined)d.review[id].critical=t.value;else d.review[id].note=t.value;}
  else if(t.hasAttribute("data-dep-context"))d.context=t.value;else return;
  persist(CASE);
  if(t.dataset.depCritical!==undefined){const select=document.getElementById("depRoot"),graph=document.getElementById("depGraph");if(select&&graph)graph.innerHTML=graphFor(d,select.value);}
}
document.addEventListener("input",saveDependencyInput);
document.addEventListener("change",saveDependencyInput);
function graphFor(d,id){
  const source=d.packages.find(p=>p.id===id);
  if(!source) return "<p>No dependency relationships reported. Inspect the component list; absence of edges is not proof of no dependencies.</p>";
  const targets=d.edges.filter(e=>e.from===id).map(e=>d.packages.find(p=>p.id===e.to)).filter(Boolean);
  const shown=targets.slice(0,24), height=Math.max(100,shown.length*62);
  return `<p>${h(source.name)} depends on ${targets.length} reported components${targets.length>24?" (first 24 shown; all components are in the table)":""}.</p><div style="overflow:auto"><svg viewBox="0 0 800 ${height}" style="width:100%;min-width:560px" role="img" aria-label="Dependencies of ${h(source.name)}"><rect x="5" y="${height/2-24}" width="265" height="48" rx="8" fill="#e6eeee"/><text x="15" y="${height/2+4}" font-size="13">${h(source.name.slice(0,33))}</text>${shown.map((p,i)=>`<path d="M270 ${height/2} L330 ${i*62+28} L355 ${i*62+28}" fill="none" stroke="#63827c"/><rect x="355" y="${i*62+5}" width="435" height="48" rx="8" fill="#f2f5f4"/><text x="365" y="${i*62+24}" font-size="13">${h(p.name.slice(0,52))}</text><text x="365" y="${i*62+42}" font-size="11">${h(((p.version||"Version unspecified")+" · "+(d.review?.[p.id]?.critical==="yes"?"CRITICAL FOR THIS USE":"Criticality not confirmed")).slice(0,68))}</text>`).join("")}</svg></div>`;
}
document.addEventListener("change", e=>{if(e.target.id==="depRoot" && CASE && CASE.signals) document.getElementById("depGraph").innerHTML=graphFor(CASE.signals.dependencies,e.target.value);});

route();
</script></body></html>
